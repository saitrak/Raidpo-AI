<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background-color: #1a1a1a;
    }

    .hero {
      text-align: center;
      padding: 6rem 2rem;
      background: linear-gradient(135deg, #ff6f61, #ff3b2f);
    }

    .tool-container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .input-box {
      border: 2px dashed #ff6f61;
      padding: 3rem;
      border-radius: 20px;
      margin: 2rem auto;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
      text-align: center;
    }

    .input-box:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }

    .input-box input {
      width: 90%;
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid #ff6f61;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .input-box input::placeholder {
      color: #ccc;
    }

    .process-btn {
      padding: 1rem 2rem;
      background: #fff;
      color: #ff3b2f;
      border-radius: 50px;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
      margin: 1rem auto;
      display: block;
      transition: all 0.3s;
    }

    .process-btn:hover:not(:disabled) {
      background: #ff6f61;
      color: #fff;
      transform: scale(1.05);
    }

    .process-btn:disabled {
      background: #ccc;
      color: #666;
      cursor: not-allowed;
    }

    .book-results {
      margin-top: 2rem;
      text-align: center;
    }

    .book-item {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
      text-align: left;
    }

    .book-item h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .book-item p {
      font-size: 1rem;
      color: #ccc;
      margin-bottom: 0.5rem;
    }

    .book-item a {
      color: #ff6f61;
      text-decoration: none;
      font-weight: bold;
    }

    .book-item a:hover {
      text-decoration: underline;
    }

    .book-reader {
      margin-top: 2rem;
      text-align: center;
    }

    .book-reader iframe {
      width: 100%;
      height: 500px;
      border: 1px solid #ff6f61;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Book Library</h1>
    <p>Search and read legal books directly in the app.</p>
  </section>

  <div class="tool-container">
    <div class="input-box">
      <input type="text" id="searchInput" placeholder="Enter book title or author...">
      <button class="process-btn" id="processBtn">Search Books</button>
    </div>

    <div class="book-results" id="bookResults"></div>
    <div class="book-reader" id="bookReader" style="display: none;">
      <iframe id="bookFrame" src="" frameborder="0"></iframe>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const processBtn = document.getElementById('processBtn');
    const bookResults = document.getElementById('bookResults');
    const bookReader = document.getElementById('bookReader');
    const bookFrame = document.getElementById('bookFrame');

    const apiUrl = 'https://openlibrary.org/search.json';

    processBtn.addEventListener('click', async () => {
      const query = searchInput.value.trim();

      if (!query) return alert('Please enter a book title or author.');

      // Disable the button during processing
      processBtn.disabled = true;
      processBtn.textContent = 'Searching...';

      try {
        const response = await fetch(`${apiUrl}?q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (data.docs.length > 0) {
          bookResults.innerHTML = ''; // Clear previous results

          data.docs.slice(0, 10).forEach(book => {
            const bookItem = document.createElement('div');
            bookItem.classList.add('book-item');
            bookItem.innerHTML = `
              <h3>${book.title}</h3>
              <p><strong>Author:</strong> ${book.author_name?.join(', ') || 'Unknown'}</p>
              <p><strong>Published:</strong> ${book.first_publish_year || 'Unknown'}</p>
              <p><strong>Publisher:</strong> ${book.publisher?.join(', ') || 'Unknown'}</p>
              <a href="#" data-key="${book.key}" class="read-link">Read Now</a>
            `;
            bookResults.appendChild(bookItem);
          });

          // Add event listeners to "Read Now" links
          document.querySelectorAll('.read-link').forEach(link => {
            link.addEventListener('click', (e) => {
              e.preventDefault();
              const bookKey = e.target.getAttribute('data-key');
              loadBook(bookKey);
            });
          });
        } else {
          throw new Error('No books found.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Failed to fetch books. Please try again.');
      } finally {
        // Re-enable the button after processing
        processBtn.disabled = false;
        processBtn.textContent = 'Search Books';
      }
    });

    function loadBook(bookKey) {
      const bookUrl = `https://openlibrary.org${bookKey}`;
      bookFrame.src = bookUrl;
      bookReader.style.display = 'block';
    }
  </script>
</body>
</html>
