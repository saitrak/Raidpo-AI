<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeCraft Pro - Editor, Merger, and Separator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background-color: #1a1a1a;
    }

    .hero {
      text-align: center;
      padding: 6rem 2rem;
      background: linear-gradient(135deg, #ff6f61, #ff3b2f);
    }

    .tool-container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .editor-box {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid #ff6f61;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      resize: none;
    }

    .preview-box {
      position: relative;
      border: 1px solid #ff6f61;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 1rem;
      margin-bottom: 2rem;
    }

    .preview-box iframe {
      width: 100%;
      height: 400px;
      border: none;
      background: #fff;
      border-radius: 10px;
    }

    .fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 0.5rem 1rem;
      background: #ff6f61;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.3s;
    }

    .fullscreen-btn:hover {
      transform: scale(1.05);
    }

    .process-btn {
      padding: 1rem 2rem;
      background: #fff;
      color: #ff3b2f;
      border-radius: 50px;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
      margin: 1rem auto;
      display: block;
      transition: all 0.3s;
    }

    .process-btn:hover:not(:disabled) {
      background: #ff6f61;
      color: #fff;
      transform: scale(1.05);
    }

    .download-btn {
      padding: 1rem 2rem;
      background: #28a745;
      color: #fff;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      margin: 1rem auto;
      display: inline-block;
      text-decoration: none;
      transition: transform 0.3s;
    }

    .download-btn:hover {
      transform: translateY(-3px);
    }

    .merged-code-box {
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid #ff6f61;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      white-space: pre-wrap;
      word-wrap: break-word;
      min-height: 100px;
    }

    .copy-btn {
      padding: 0.5rem 1rem;
      background: #ff6f61;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.3s;
      margin-left: 1rem;
    }

    .copy-btn-small {
      padding: 0.3rem 0.8rem; /* Smaller padding to match button size with text */
      background: #ff6f61;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.3s;
      margin-left: 1rem;
    }

    .copy-btn-small:hover {
      transform: scale(1.05);
    }

    .separate-tool {
      margin-top: 4rem;
    }

    .separated-code-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1rem;
    }

    .separated-code-section h3 {
      margin: 0;
      color: #ff6f61;
    }

    .separated-code-section .code-actions {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>CodeCraft Pro - Editor, Merger, and Separator</h1>
    <p>Write, preview, merge, separate, and download HTML, CSS, and JavaScript code.</p>
  </section>

  <div class="tool-container">
    <!-- HTML Editor and Runner -->
    <div class="editor-box">
      <textarea id="combinedCode" placeholder="Write your HTML, CSS, and JavaScript code here..."></textarea>
    </div>

    <div class="preview-box">
      <button class="fullscreen-btn" id="fullscreenBtn">Full Screen Preview</button>
      <iframe id="previewFrame"></iframe>
    </div>

    <button class="process-btn" id="processBtn">Run Code</button>
    <a class="download-btn" id="downloadBtn" download="code.html">Download Code</a>

    <!-- HTML+CSS+JavaScript Merger Tool -->
    <div class="editor-box">
      <textarea id="htmlInput" placeholder="Enter your HTML code here..."></textarea>
      <textarea id="cssInput" placeholder="Enter your CSS code here..."></textarea>
      <textarea id="jsInput" placeholder="Enter your JavaScript code here..."></textarea>
    </div>

    <div id="mergedCodeBox" class="merged-code-box" contenteditable="true">Merged code will appear here...</div>
    <button class="copy-btn" id="copyMergedCodeBtn">Copy Merged Code</button>
    <a class="download-btn" id="mergeDownloadBtn" download="merged-code.html">Download Merged Code</a>
    <button class="process-btn" id="mergeBtn">Merge Code</button>

    <!-- Separator Tool -->
    <div class="separate-tool">
      <h2>Separator Tool</h2>
      <textarea id="combinedInput" placeholder="Paste your combined HTML, CSS, and JavaScript code here..."></textarea>

      <div class="separated-code-section">
        <div>
          <h3>HTML Code</h3>
          <textarea id="separatedHtml" placeholder="Separated HTML code will appear here..."></textarea>
          <div class="code-actions">
            <button class="copy-btn-small" id="copyHtmlBtn">Copy HTML</button>
            <a class="download-btn" id="downloadHtmlBtn" download="separated-html.html">Download HTML</a>
          </div>
        </div>

        <div>
          <h3>CSS Code</h3>
          <textarea id="separatedCss" placeholder="Separated CSS code will appear here..."></textarea>
          <div class="code-actions">
            <button class="copy-btn-small" id="copyCssBtn">Copy CSS</button>
            <a class="download-btn" id="downloadCssBtn" download="separated-css.css">Download CSS</a>
          </div>
        </div>

        <div>
          <h3>JavaScript Code</h3>
          <textarea id="separatedJs" placeholder="Separated JavaScript code will appear here..."></textarea>
          <div class="code-actions">
            <button class="copy-btn-small" id="copyJsBtn">Copy JavaScript</button>
            <a class="download-btn" id="downloadJsBtn" download="separated-js.js">Download JavaScript</a>
          </div>
        </div>
      </div>

      <button class="process-btn" id="separateBtn">Separate Code</button>
    </div>
  </div>

  <script>
    // HTML Editor and Runner Logic
    const combinedCode = document.getElementById('combinedCode');
    const processBtn = document.getElementById('processBtn');
    const previewFrame = document.getElementById('previewFrame');
    const downloadBtn = document.getElementById('downloadBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    processBtn.addEventListener('click', () => {
      const userCode = combinedCode.value.trim();

      // Construct the full HTML document
      const fullCode = `
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
        </head>
        <body>
          ${userCode}
        </body>
        </html>
      `;

      // Display the preview in the iframe
      previewFrame.srcdoc = fullCode;

      // Enable the download button and set the file content
      const blob = new Blob([fullCode], { type: 'text/html' });
      downloadBtn.href = URL.createObjectURL(blob);
      downloadBtn.style.display = 'inline-block';
    });

    // Full-screen functionality for the preview iframe
    fullscreenBtn.addEventListener('click', () => {
      const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;

      if (iframeDoc.documentElement.requestFullscreen) {
        iframeDoc.documentElement.requestFullscreen();
      } else if (iframeDoc.documentElement.mozRequestFullScreen) {
        iframeDoc.documentElement.mozRequestFullScreen(); // Firefox
      } else if (iframeDoc.documentElement.webkitRequestFullscreen) {
        iframeDoc.documentElement.webkitRequestFullscreen(); // Chrome, Safari, Opera
      } else if (iframeDoc.documentElement.msRequestFullscreen) {
        iframeDoc.documentElement.msRequestFullscreen(); // IE/Edge
      }
    });

    // HTML+CSS+JavaScript Merger Tool Logic
    const htmlInput = document.getElementById('htmlInput');
    const cssInput = document.getElementById('cssInput');
    const jsInput = document.getElementById('jsInput');
    const mergeBtn = document.getElementById('mergeBtn');
    const mergedCodeBox = document.getElementById('mergedCodeBox');
    const copyMergedCodeBtn = document.getElementById('copyMergedCodeBtn');
    const mergeDownloadBtn = document.getElementById('mergeDownloadBtn');

    mergeBtn.addEventListener('click', () => {
      const html = htmlInput.value.trim();
      const css = cssInput.value.trim();
      const js = jsInput.value.trim();

      // Construct the merged code
      const mergedCode = `
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <style>${css}</style>
        </head>
        <body>
          ${html}
          <script>${js}<\/script>
        </body>
        </html>
      `;

      // Display the merged code in the result box
      mergedCodeBox.textContent = mergedCode;

      // Enable the download button and set the file content
      const blob = new Blob([mergedCode], { type: 'text/html' });
      mergeDownloadBtn.href = URL.createObjectURL(blob);
    });

    // Copy the merged code to clipboard
    copyMergedCodeBtn.addEventListener('click', () => {
      const mergedCode = mergedCodeBox.textContent;
      navigator.clipboard.writeText(mergedCode).then(() => {
        alert('Merged code copied to clipboard!');
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    });

    // Separator Tool Logic
    const combinedInput = document.getElementById('combinedInput');
    const separateBtn = document.getElementById('separateBtn');
    const separatedHtml = document.getElementById('separatedHtml');
    const separatedCss = document.getElementById('separatedCss');
    const separatedJs = document.getElementById('separatedJs');
    const copyHtmlBtn = document.getElementById('copyHtmlBtn');
    const copyCssBtn = document.getElementById('copyCssBtn');
    const copyJsBtn = document.getElementById('copyJsBtn');
    const downloadHtmlBtn = document.getElementById('downloadHtmlBtn');
    const downloadCssBtn = document.getElementById('downloadCssBtn');
    const downloadJsBtn = document.getElementById('downloadJsBtn');

    separateBtn.addEventListener('click', () => {
      const combinedText = combinedInput.value.trim();

      if (!combinedText) {
        alert('Please enter some code to separate!');
        return;
      }

      // Extract HTML, CSS, and JavaScript using regex
      const htmlMatch = combinedText.match(/<body[^>]*>([\s\S]*)<\/body>/i);
      const cssMatch = combinedText.match(/<style[^>]*>([\s\S]*)<\/style>/i);
      const jsMatch = combinedText.match(/<script[^>]*>([\s\S]*)<\/script>/i);

      // Populate the separated textareas
      separatedHtml.value = htmlMatch ? htmlMatch[1].trim() : '';
      separatedCss.value = cssMatch ? cssMatch[1].trim() : '';
      separatedJs.value = jsMatch ? jsMatch[1].trim() : '';

      // Enable copy buttons
      copyHtmlBtn.onclick = () => {
        navigator.clipboard.writeText(separatedHtml.value).then(() => {
          alert('HTML code copied to clipboard!');
        });
      };

      copyCssBtn.onclick = () => {
        navigator.clipboard.writeText(separatedCss.value).then(() => {
          alert('CSS code copied to clipboard!');
        });
      };

      copyJsBtn.onclick = () => {
        navigator.clipboard.writeText(separatedJs.value).then(() => {
          alert('JavaScript code copied to clipboard!');
        });
      };

      // Enable download buttons
      const htmlBlob = new Blob([separatedHtml.value], { type: 'text/html' });
      downloadHtmlBtn.href = URL.createObjectURL(htmlBlob);

      const cssBlob = new Blob([separatedCss.value], { type: 'text/css' });
      downloadCssBtn.href = URL.createObjectURL(cssBlob);

      const jsBlob = new Blob([separatedJs.value], { type: 'application/javascript' });
      downloadJsBtn.href = URL.createObjectURL(jsBlob);
    });
  </script>
</body>
</html>
