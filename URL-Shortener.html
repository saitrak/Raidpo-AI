<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raidpo AI - URL Shortener</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background-color: #1a1a1a; /* Darker background */
    }

    .hero {
      text-align: center;
      padding: 6rem 2rem;
      background: linear-gradient(135deg, #ff6f61, #ff3b2f);
    }

    .tool-container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .input-box {
      border: 2px dashed #ff6f61;
      padding: 3rem;
      border-radius: 20px;
      margin: 2rem auto;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
      text-align: center;
    }

    .input-box:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }

    .input-box input {
      width: 90%;
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid #ff6f61;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .input-box input::placeholder {
      color: #ccc;
    }

    .process-btn {
      padding: 1rem 2rem;
      background: #fff;
      color: #ff3b2f;
      border-radius: 50px;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
      margin: 1rem auto;
      display: block;
      transition: all 0.3s;
    }

    .process-btn:hover:not(:disabled) {
      background: #ff6f61;
      color: #fff;
      transform: scale(1.05);
    }

    .process-btn:disabled {
      background: #ccc;
      color: #666;
      cursor: not-allowed;
    }

    .output-box {
      margin-top: 2rem;
      text-align: center;
    }

    .output-box input {
      width: 90%;
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid #ff6f61;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .copy-btn {
      padding: 1rem 2rem;
      background: #28a745;
      color: #fff;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      margin: 1rem auto;
      display: none;
      transition: transform 0.3s;
    }

    .copy-btn:hover {
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>URL Shortener</h1>
    <p>Shorten your URLs with ease.</p>
  </section>

  <div class="tool-container">
    <div class="input-box">
      <input type="url" id="longUrl" placeholder="Enter your long URL...">
      <button class="process-btn" id="processBtn">Shorten URL</button>
    </div>

    <div class="output-box">
      <input type="text" id="shortUrl" placeholder="Shortened URL will appear here..." readonly>
      <button class="copy-btn" id="copyBtn">Copy URL</button>
    </div>
  </div>

  <script>
    const longUrlInput = document.getElementById('longUrl');
    const processBtn = document.getElementById('processBtn');
    const shortUrlInput = document.getElementById('shortUrl');
    const copyBtn = document.getElementById('copyBtn');

    processBtn.addEventListener('click', async () => {
      const longUrl = longUrlInput.value.trim();

      if (!longUrl) return alert('Please enter a long URL.');

      // Disable the button during processing
      processBtn.disabled = true;
      processBtn.textContent = 'Shortening...';

      try {
        // Use TinyURL API to shorten the URL
        const apiUrl = `https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`;
        const response = await fetch(apiUrl);
        const shortUrl = await response.text();

        if (!shortUrl || shortUrl.includes('error')) {
          throw new Error('Failed to shorten URL. Please try again.');
        }

        // Display the shortened URL
        shortUrlInput.value = shortUrl;
        copyBtn.style.display = 'block';
      } catch (error) {
        console.error('Error:', error);
        alert('Failed to shorten URL. Please try again.');
      } finally {
        // Re-enable the button after processing
        processBtn.disabled = false;
        processBtn.textContent = 'Shorten URL';
      }
    });

    copyBtn.addEventListener('click', () => {
      shortUrlInput.select();
      document.execCommand('copy');
      alert('URL copied to clipboard!');
    });
  </script>
</body>
</html>
