<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text-To-Image-Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background-color: #0f0f0f;
    }

    .hero {
      text-align: center;
      padding: 6rem 2rem;
      background: linear-gradient(135deg, #ff6f61, #ff3b2f);
    }

    .tool-container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .prompt-box {
      border: 2px dashed #ff6f61;
      padding: 3rem;
      border-radius: 20px;
      margin: 2rem auto;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
      text-align: center;
    }

    .prompt-box:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }

    #prompt-input {
      width: 100%;
      height: 150px;
      padding: 1rem;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      resize: vertical;
    }

    .options-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    .option-group {
      background: rgba(255, 255, 255, 0.05);
      padding: 1.5rem;
      border-radius: 15px;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .preset-card {
      padding: 1rem;
      border: 1px solid #ff6f61;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .preset-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #ff6f61, #ff3b2f);
      opacity: 0;
      transition: opacity 0.3s;
      z-index: -1;
    }

    .preset-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(255, 111, 97, 0.3);
    }

    .preset-card.selected {
      border: 2px solid #ff6f61;
      background: rgba(255, 111, 97, 0.1);
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(255, 111, 97, 0.3);
    }

    .preset-card i {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #ff6f61;
    }

    .process-btn {
      padding: 1rem 2rem;
      background: #fff;
      color: #ff3b2f;
      border-radius: 50px;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
      margin: 2rem auto;
      display: block;
      transition: all 0.3s;
    }

    .process-btn:hover {
      background: #ff6f61;
      color: #fff;
      transform: scale(1.05);
    }

    .image-preview {
      margin-top: 2rem;
      text-align: center;
      position: relative;
    }

    .image-preview img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .image-preview:hover .download-btn {
      display: block;
    }

    .loader {
      display: none;
      border: 4px solid #333;
      border-top: 4px solid #ff6f61;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-message {
      color: #ff4444;
      padding: 1rem;
      display: none;
      font-weight: 500;
    }

    .history-section {
      margin-top: 3rem;
    }

    .history-section h2 {
      text-align: center;
      margin-bottom: 1rem;
    }

    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .history-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .history-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    .history-item .download-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      padding: 0.5rem 1rem;
      background: #28a745;
      color: #fff;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      display: none;
      transition: transform 0.3s;
    }

    .history-item:hover .download-btn {
      display: block;
    }

    .time-taken {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Text-To-Image-Generator</h1>
    <p>Transform text into stunning images with AI.</p>
  </section>

  <div class="tool-container">
    <div class="prompt-box">
      <textarea 
        id="prompt-input" 
        placeholder="Describe your imagination... (e.g. 'A majestic dragon soaring over medieval castle')"
      ></textarea>
    </div>

    <div class="options-container">
      <div class="option-group">
        <h3>Image Style</h3>
        <div class="preset-grid">
          <div class="preset-card selected" data-style="realistic">
            <i class="fas fa-camera"></i>
            <span>Realistic</span>
          </div>
          <div class="preset-card" data-style="cartoon">
            <i class="fas fa-paint-brush"></i>
            <span>Cartoon</span>
          </div>
          <div class="preset-card" data-style="anime">
            <i class="fas fa-moon"></i>
            <span>Anime</span>
          </div>
          <div class="preset-card" data-style="painting">
            <i class="fas fa-palette"></i>
            <span>Painting</span>
          </div>
        </div>
      </div>

      <div class="option-group">
        <h3>Image Ratio</h3>
        <div class="preset-grid">
          <div class="preset-card selected" data-ratio="1:1">
            <i class="fas fa-square"></i>
            <span>Square (1:1)</span>
          </div>
          <div class="preset-card" data-ratio="16:9">
            <i class="fas fa-desktop"></i>
            <span>Widescreen (16:9)</span>
          </div>
          <div class="preset-card" data-ratio="9:16">
            <i class="fas fa-mobile"></i>
            <span>Vertical (9:16)</span>
          </div>
          <div class="preset-card" data-ratio="4:3">
            <i class="fas fa-tablet"></i>
            <span>Standard (4:3)</span>
          </div>
        </div>
      </div>
    </div>

    <button class="process-btn" id="generateBtn">Generate Image</button>

    <div class="image-preview">
      <div class="loader" id="loader"></div>
      <div class="error-message" id="error-message"></div>
      <img id="generated-image" alt="Generated image">
      <button class="download-btn" id="downloadBtn"><i class="fas fa-download"></i> Download</button>
      <div class="time-taken" id="time-taken"></div>
    </div>

    <!-- History Section -->
    <div class="history-section">
      <h2>Generated Images History</h2>
      <div class="history-grid" id="history-grid"></div>
    </div>
  </div>

  <script>
    const HF_TOKEN = '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';
    const MODEL_ID = 'stabilityai/stable-diffusion-xl-base-1.0';
    const MAX_RETRIES = 3;
    let currentRetries = 0;
    let generatedUrl = null;
    let history = []; // Array to store generated image URLs

    // UI Elements
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const generatedImage = document.getElementById('generated-image');
    const loader = document.getElementById('loader');
    const errorMessage = document.getElementById('error-message');
    const stylePresets = document.querySelectorAll('[data-style]');
    const ratioPresets = document.querySelectorAll('[data-ratio]');
    const historyGrid = document.getElementById('history-grid');
    const timeTaken = document.getElementById('time-taken');

    // Style and Ratio Handling
    function setupPresets(presets, group) {
      presets.forEach(preset => {
        preset.addEventListener('click', () => {
          document.querySelectorAll(`[data-${group}]`).forEach(p => p.classList.remove('selected'));
          preset.classList.add('selected');
        });
      });
    }

    setupPresets(stylePresets, 'style');
    setupPresets(ratioPresets, 'ratio');

    // Size Calculation based on Ratio
    function getDimensions(ratio) {
      const ratios = {
        '1:1': [1024, 1024],
        '16:9': [1280, 720],
        '9:16': [720, 1280],
        '4:3': [1024, 768]
      };
      return ratios[ratio] || [1024, 1024];
    }

    // Style Modifiers
    function getStyleModifiers(style) {
      const modifiers = {
        realistic: "ultra realistic, 8k resolution, detailed textures",
        cartoon: "cartoon style, vibrant colors, smooth shading",
        anime: "anime style, cel shading, vibrant colors, detailed line art",
        painting: "oil painting style, visible brush strokes, artistic composition"
      };
      return modifiers[style] || "";
    }

    // Add Image to History
    function addToHistory(imageUrl) {
      history.push(imageUrl); // Add to history array
      const historyItem = document.createElement('div');
      historyItem.classList.add('history-item');
      historyItem.innerHTML = `
        <img src="${imageUrl}" alt="Generated image">
        <button class="download-btn" onclick="downloadImage('${imageUrl}')"><i class="fas fa-download"></i> Download</button>
      `;
      historyGrid.appendChild(historyItem); // Add to history grid
    }

    // Download Image
    function downloadImage(url) {
      const link = document.createElement('a');
      link.href = url;
      link.download = `text-to-image-${Date.now()}.jpg`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Handle Download Button for Newly Generated Image
    downloadBtn.addEventListener('click', () => {
      if (!generatedUrl) return alert('No generated image available!');
      downloadImage(generatedUrl);
    });

    async function generateImage() {
      const prompt = document.getElementById('prompt-input').value.trim();
      const selectedStyle = document.querySelector('[data-style].selected').dataset.style;
      const selectedRatio = document.querySelector('[data-ratio].selected').dataset.ratio;
      const [width, height] = getDimensions(selectedRatio);
      const styleModifier = getStyleModifiers(selectedStyle);

      // UI state reset
      errorMessage.style.display = 'none';
      generatedImage.style.display = 'none';
      generateBtn.disabled = true;
      loader.style.display = 'block';
      downloadBtn.style.display = 'none';
      timeTaken.textContent = ''; // Clear previous time

      if (!prompt) {
        showError('Please enter a description to generate image');
        return;
      }

      try {
        const startTime = Date.now(); // Start timer

        const response = await fetch(
          `https://api-inference.huggingface.co/models/${MODEL_ID}`,
          {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${HF_TOKEN}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              inputs: `${prompt}, ${styleModifier}`,
              parameters: {
                width: width,
                height: height,
                num_inference_steps: 65,
                guidance_scale: 14,
                negative_prompt: "blurry, deformed, low quality, watermark, text",
                refine: "expert_ensemble_refiner",
                safety_checker: false
              }
            })
          }
        );

        if (!response.ok) {
          if (response.status === 503 && currentRetries < MAX_RETRIES) {
            currentRetries++;
            setTimeout(generateImage, 2000);
            return;
          }
          throw new Error(`API Error: ${response.status} - ${await response.text()}`);
        }

        const blob = await response.blob();
        generatedUrl = URL.createObjectURL(blob);

        // Add to history
        addToHistory(generatedUrl);

        generatedImage.onload = () => {
          URL.revokeObjectURL(generatedUrl);
          generatedImage.style.display = 'block';
          downloadBtn.style.display = 'block';

          // Calculate and display time taken
          const endTime = Date.now();
          const timeElapsed = ((endTime - startTime) / 1000).toFixed(2);
          timeTaken.textContent = `Time taken: ${timeElapsed} seconds`;
        };
        generatedImage.src = generatedUrl;
        currentRetries = 0;

      } catch (error) {
        console.error('Generation error:', error);
        showError(`Failed to generate image: ${error.message}`);
      } finally {
        loader.style.display = 'none';
        generateBtn.disabled = false;
      }
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
    }

    // Init generate button
    generateBtn.addEventListener('click', generateImage);
  </script>
</body>
</html>
