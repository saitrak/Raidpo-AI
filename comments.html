<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comments - Raidpo AI</title>
  <link rel="icon" href="https://res.cloudinary.com/dml8j7b8w/image/upload/v1751829931/lzk7ckkwyrhiqtio8g8i.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

  <style>
    /* Base theme styles remain the same */
    :root {
      --bg-primary: #0f0f0f; --bg-secondary: #1a1a1a; --bg-card: #282828; --text-primary: #fff; --text-secondary: #ccc; --accent-primary: #ff6f61; --accent-secondary: #ff3b2f; --border-color: #333; --loved-color: #e2264d; --liked-color: #4a90e2;
    }
    .light-theme {
      --bg-primary: #f4f4f9; --bg-secondary: #ffffff; --bg-card: #ffffff; --text-primary: #212529; --text-secondary: #6c7d7d; --border-color: #dee2e6;
    }
    body { font-family: 'Comic Sans MS', cursive, sans-serif; margin: 0; padding: 0; color: var(--text-primary); background-color: var(--bg-primary); transition: background-color 0.3s, color 0.3s; }
    ::selection { background-color: var(--accent-primary); color: #fff; }
    body::-webkit-scrollbar { width: 8px; }
    body::-webkit-scrollbar-track { background: var(--bg-card); }
    body::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 4px; }
    .comments-page-container { max-width: 800px; margin: 2rem auto; padding: 2rem; }
    h1 { text-align: center; color: var(--accent-primary); margin-bottom: 2rem; }
    .comment-form-container { margin-bottom: 2rem; }
    #comment-form textarea { width: 100%; height: 100px; padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--bg-secondary); color: var(--text-primary); font-family: inherit; font-size: 1rem; resize: vertical; box-sizing: border-box; }
    #comment-form textarea:focus { outline: none; border-color: var(--accent-primary); }
    #comment-form button { display: block; margin-top: 1rem; margin-left: auto; padding: 0.75rem 1.5rem; border: none; border-radius: 50px; background-color: var(--accent-primary); color: #fff; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background-color 0.3s, transform 0.2s; }
    #comment-form button:hover { background-color: var(--accent-secondary); transform: scale(1.05); }
    #login-prompt { text-align: center; padding: 2rem; background-color: var(--bg-secondary); border: 1px dashed var(--border-color); border-radius: 8px; }
    #login-prompt a { color: var(--accent-primary); font-weight: bold; text-decoration: underline; }
    #comments-list { display: flex; flex-direction: column; gap: 1.5rem; }
    #loading-comments { text-align: center; color: var(--text-secondary); font-style: italic; padding: 2rem; }
    .comment { display: flex; gap: 1rem; padding: 1.5rem; background-color: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); }
    .comment-profile-icon { flex-shrink: 0; width: 50px; height: 50px; border-radius: 50%; background-color: var(--accent-primary); background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; color: #fff; }
    .comment-content { width: 100%; }
    .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .comment-user-name { font-weight: bold; font-size: 1.1rem; }
    .comment-timestamp { font-size: 0.8rem; color: var(--text-secondary); }
    .comment-body { color: var(--text-secondary); line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
    
    /* --- UPGRADED ACTION BAR STYLES --- */
    .comment-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem; /* Increased gap */
      margin-top: 1rem;
      color: var(--text-secondary);
    }
    .action-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .action-btn {
      cursor: pointer;
      font-size: 1.2rem;
      transition: color 0.2s, transform 0.2s;
    }
    .action-btn:hover {
      transform: scale(1.2);
    }
    .like-btn.liked { color: var(--liked-color); }
    .love-btn.loved { color: var(--loved-color); }
    .copy-btn.copied { color: var(--accent-primary); }
  </style>
</head>
<body>

  <main class="comments-page-container">
    <h1>Discussion</h1>
    <div class="comment-form-container" id="comment-form-container" style="display: none;">
      <form id="comment-form">
        <textarea id="comment-input" placeholder="Join the discussion..." required></textarea>
        <button type="submit">Post Comment</button>
      </form>
    </div>
    <div id="login-prompt" style="display: none;">
        <p>Please <a href="/login-form">log in</a> to post comments and share your love!</p>
    </div>
    <div id="comments-list">
        <div id="loading-comments">Loading comments...</div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBnXZuupUuEU-YQINri3isg_k2av1p4bHY",
      authDomain: "raidpo-ai-3c84b.firebaseapp.com",
      projectId: "raidpo-ai-3c84b",
      storageBucket: "raidpo-ai-3c84b.appspot.com",
      messagingSenderId: "41213161184",
      appId: "1:41213161184:web:58604fc48f2c026f5aaa85",
      measurementId: "G-7MBZHVFCZR"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const commentFormContainer = document.getElementById('comment-form-container');
    const loginPrompt = document.getElementById('login-prompt');
    const commentForm = document.getElementById('comment-form');
    const commentInput = document.getElementById('comment-input');
    const commentsList = document.getElementById('comments-list');
    const loadingComments = document.getElementById('loading-comments');
    
    function applyTheme() {
      const savedTheme = localStorage.getItem('raidpo-theme') || 'dark';
      document.documentElement.classList.toggle('light-theme', savedTheme === 'light');
    }
    applyTheme();

    let currentUser = null;

    auth.onAuthStateChanged(user => {
      currentUser = user;
      commentFormContainer.style.display = user ? 'block' : 'none';
      loginPrompt.style.display = user ? 'none' : 'block';
      loadComments();
    });

    function loadComments() {
        const commentsCollection = db.collection('comments').orderBy('timestamp', 'desc');
        commentsCollection.onSnapshot(snapshot => {
            loadingComments.style.display = 'none';
            commentsList.innerHTML = '';
            if (snapshot.empty) {
                commentsList.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">No comments yet. Be the first to post!</p>';
                return;
            }
            snapshot.forEach(doc => renderComment(doc.id, doc.data()));
        }, error => {
            console.error("Error fetching comments: ", error);
            loadingComments.innerHTML = `Could not load comments. Error: ${error.message}`;
        });
    }

    function renderComment(id, data) {
        const commentDiv = document.createElement('div');
        commentDiv.className = 'comment';
        commentDiv.dataset.id = id;
        
        const profileIcon = data.userPhotoURL 
            ? `<div class="comment-profile-icon" style="background-image: url('${data.userPhotoURL}')"></div>` 
            : `<div class="comment-profile-icon"><i class="fas fa-user"></i></div>`;

        // Check liked/loved status for the current user
        const isLiked = currentUser && data.likedBy && data.likedBy.includes(currentUser.uid);
        const isLoved = currentUser && data.lovedBy && data.lovedBy.includes(currentUser.uid);
        
        const timeAgo = data.timestamp ? formatTimeAgo(data.timestamp.toDate()) : 'just now';

        commentDiv.innerHTML = `
            ${profileIcon}
            <div class="comment-content">
                <div class="comment-header">
                    <span class="comment-user-name">${escapeHTML(data.userName || 'Anonymous')}</span>
                    <span class="comment-timestamp">${timeAgo}</span>
                </div>
                <p class="comment-body">${escapeHTML(data.text)}</p>
                <div class="comment-actions">
                    <!-- Like (Thumbs-up) Group -->
                    <div class="action-group">
                        <i class="action-btn like-btn ${isLiked ? 'fa-solid liked' : 'fa-regular'} fa-thumbs-up"></i>
                        <span class="like-count">${data.likes || 0}</span>
                    </div>
                    <!-- Love (Heart) Group -->
                    <div class="action-group">
                        <i class="action-btn love-btn ${isLoved ? 'fa-solid loved' : 'fa-regular'} fa-heart"></i>
                        <span class="love-count">${data.loves || 0}</span>
                    </div>
                    <!-- Copy Group -->
                    <div class="action-group">
                        <i class="action-btn copy-btn fa-regular fa-copy"></i>
                    </div>
                </div>
            </div>`;
        commentsList.appendChild(commentDiv);
    }

    // --- MAIN EVENT LISTENER FOR ALL COMMENT ACTIONS ---
    commentsList.addEventListener('click', e => {
        if (!currentUser) {
            if(e.target.classList.contains('action-btn')) alert("You must be logged in to interact.");
            return;
        }

        const button = e.target;
        const commentElement = button.closest('.comment');
        if (!commentElement) return;
        const commentId = commentElement.dataset.id;
        
        // Handle Like/Love clicks with Optimistic Updates
        if (button.matches('.like-btn, .love-btn')) {
            handleReaction(button, commentId);
        }

        // Handle Copy click
        if (button.matches('.copy-btn')) {
            handleCopy(button, commentElement);
        }
    });
    
    function handleReaction(button, commentId) {
        const isLikeBtn = button.classList.contains('like-btn');
        const fieldPrefix = isLikeBtn ? 'likes' : 'loves';
        const fieldCounter = fieldPrefix; // e.g., 'likes' or 'loves'
        const fieldArray = isLikeBtn ? 'likedBy' : 'lovedBy'; // e.g., 'likedBy' or 'lovedBy'
        
        const countSpan = button.nextElementSibling;
        const currentCount = parseInt(countSpan.textContent);
        const isReacted = button.classList.contains(isLikeBtn ? 'liked' : 'loved');

        // --- 1. OPTIMISTIC UI UPDATE (INSTANT FEEDBACK) ---
        const newCount = isReacted ? currentCount - 1 : currentCount + 1;
        countSpan.textContent = newCount;
        button.classList.toggle(isLikeBtn ? 'liked' : 'loved');
        button.classList.toggle('fa-solid');
        button.classList.toggle('fa-regular');
        
        // --- 2. SEND UPDATE TO FIREBASE IN THE BACKGROUND ---
        const commentRef = db.collection('comments').doc(commentId);
        const updateAction = isReacted 
            ? firebase.firestore.FieldValue.arrayRemove(currentUser.uid) 
            : firebase.firestore.FieldValue.arrayUnion(currentUser.uid);

        commentRef.update({
            [fieldCounter]: newCount,
            [fieldArray]: updateAction
        }).catch(error => {
            // --- 3. REVERT UI IF FIREBASE UPDATE FAILS ---
            console.error("Firebase update failed:", error);
            countSpan.textContent = currentCount; // Revert count
            button.classList.toggle(isLikeBtn ? 'liked' : 'loved'); // Revert classes
            button.classList.toggle('fa-solid');
            button.classList.toggle('fa-regular');
            alert("Couldn't save your reaction. Please try again.");
        });
    }

    function handleCopy(button, commentElement) {
        const commentText = commentElement.querySelector('.comment-body').innerText;
        navigator.clipboard.writeText(commentText).then(() => {
            // Provide visual feedback
            button.classList.remove('fa-copy');
            button.classList.add('fa-check');
            button.classList.add('copied');

            // Revert after a short delay
            setTimeout(() => {
                button.classList.remove('fa-check');
                button.classList.add('fa-copy');
                button.classList.remove('copied');
            }, 1500);
        }).catch(err => {
            console.error('Failed to copy text: ', err);
            alert("Could not copy text.");
        });
    }

    commentForm.addEventListener('submit', e => {
        e.preventDefault();
        if (!currentUser) { alert("You must be logged in to post a comment."); return; }
        const commentText = commentInput.value.trim();
        if (commentText) {
            db.collection('comments').add({
                text: commentText,
                userName: currentUser.displayName,
                userPhotoURL: currentUser.photoURL,
                userId: currentUser.uid,
                likes: 0,
                likedBy: [],
                loves: 0, // NEW
                lovedBy: [], // NEW (renamed from old likedBy)
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => { commentInput.value = ''; }).catch(error => { console.error("Error adding comment: ", error); alert("There was an error posting your comment."); });
        }
    });

    // --- UTILITY FUNCTIONS ---
    function escapeHTML(str) {
        const p = document.createElement('p');
        p.appendChild(document.createTextNode(str));
        return p.innerHTML;
    }
    function formatTimeAgo(date) {
        const seconds = Math.floor((new Date() - date) / 1000); let interval = seconds / 31536000;
        if (interval > 1) return Math.floor(interval) + " years ago"; interval = seconds / 2592000;
        if (interval > 1) return Math.floor(interval) + " months ago"; interval = seconds / 86400;
        if (interval > 1) return Math.floor(interval) + " days ago"; interval = seconds / 3600;
        if (interval > 1) return Math.floor(interval) + " hours ago"; interval = seconds / 60;
        if (interval > 1) return Math.floor(interval) + " minutes ago"; return "just now";
    }
  </script>
</body>
</html>
