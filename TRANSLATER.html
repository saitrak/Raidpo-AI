<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raidpo AI - All Language Translator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background-color: #0f0f0f;
    }

    .hero {
      text-align: center;
      padding: 6rem 2rem;
      background: linear-gradient(135deg, #ff6f61, #ff3b2f);
    }

    .tool-container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .input-box {
      border: 2px dashed #ff6f61;
      padding: 2rem;
      border-radius: 20px;
      margin: 2rem auto;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .input-box textarea {
      width: 100%;
      height: 150px;
      padding: 1rem;
      border: 1px solid #ff6f61;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      resize: none;
    }

    .input-box textarea::placeholder {
      color: #ccc;
    }

    .language-box {
      border: 2px dashed #ff6f61;
      padding: 2rem;
      border-radius: 20px;
      margin: 2rem auto;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .language-box select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ff6f61;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      appearance: none; /* Remove default arrow */
      -webkit-appearance: none; /* Remove default arrow for Safari */
      -moz-appearance: none; /* Remove default arrow for Firefox */
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ff6f61%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 0.5rem center;
      background-size: 12px;
    }

    /* Fix dropdown options styling */
    .language-box select option {
      background-color: #333; /* Dark background for options */
      color: #fff; /* White text for options */
    }

    .input-box button {
      padding: 0.75rem 1.5rem;
      margin-top: 1rem;
      background: #fff;
      color: #ff3b2f;
      border-radius: 50px;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
    }

    .input-box button:hover {
      background: #ff6f61;
      color: #fff;
      transform: scale(1.05);
    }

    .output-box {
      border: 2px dashed #ff6f61;
      padding: 2rem;
      border-radius: 20px;
      margin: 2rem auto;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1);
      text-align: center;
      position: relative;
    }

    .output-box textarea {
      width: 100%;
      height: 150px;
      padding: 1rem;
      border: 1px solid #ff6f61;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      resize: none;
    }

    .copy-btn {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      padding: 0.5rem 1rem;
      background: #28a745;
      color: #fff;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .copy-btn:hover {
      transform: translateY(-3px);
    }

    #loading {
      display: none;
      color: #ff6f61;
      margin-top: 1rem;
    }

    #error {
      display: none;
      color: #ff0000;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>All Language Translator</h1>
    <p>Translate text from any language to any language instantly.</p>
  </section>

  <div class="tool-container">
    <div class="input-box">
      <textarea id="inputText" placeholder="Enter text to translate..."></textarea>
      <button id="translateBtn">Translate</button>
    </div>

    <div class="language-box">
      <select id="targetLanguage">
        <!-- Supported languages by Google Translate -->
        <option value="af">Afrikaans</option>
        <option value="sq">Albanian</option>
        <option value="ar">Arabic</option>
        <option value="hy">Armenian</option>
        <option value="az">Azerbaijani</option>
        <option value="eu">Basque</option>
        <option value="be">Belarusian</option>
        <option value="bn">Bengali</option>
        <option value="bs">Bosnian</option>
        <option value="bg">Bulgarian</option>
        <option value="ca">Catalan</option>
        <option value="ceb">Cebuano</option>
        <option value="ny">Chichewa</option>
        <option value="zh-CN">Chinese (Simplified)</option>
        <option value="zh-TW">Chinese (Traditional)</option>
        <option value="co">Corsican</option>
        <option value="hr">Croatian</option>
        <option value="cs">Czech</option>
        <option value="da">Danish</option>
        <option value="nl">Dutch</option>
        <option value="en">English</option>
        <option value="eo">Esperanto</option>
        <option value="et">Estonian</option>
        <option value="tl">Filipino</option>
        <option value="fi">Finnish</option>
        <option value="fr">French</option>
        <option value="fy">Frisian</option>
        <option value="gl">Galician</option>
        <option value="ka">Georgian</option>
        <option value="de">German</option>
        <option value="el">Greek</option>
        <option value="gu">Gujarati</option>
        <option value="ht">Haitian Creole</option>
        <option value="ha">Hausa</option>
        <option value="haw">Hawaiian</option>
        <option value="he">Hebrew</option>
        <option value="hi">Hindi</option>
        <option value="hmn">Hmong</option>
        <option value="hu">Hungarian</option>
        <option value="is">Icelandic</option>
        <option value="ig">Igbo</option>
        <option value="id">Indonesian</option>
        <option value="ga">Irish</option>
        <option value="it">Italian</option>
        <option value="ja">Japanese</option>
        <option value="jw">Javanese</option>
        <option value="kn">Kannada</option>
        <option value="kk">Kazakh</option>
        <option value="km">Khmer</option>
        <option value="ko">Korean</option>
        <option value="ku">Kurdish</option>
        <option value="ky">Kyrgyz</option>
        <option value="lo">Lao</option>
        <option value="la">Latin</option>
        <option value="lv">Latvian</option>
        <option value="lt">Lithuanian</option>
        <option value="lb">Luxembourgish</option>
        <option value="mk">Macedonian</option>
        <option value="mg">Malagasy</option>
        <option value="ms">Malay</option>
        <option value="ml">Malayalam</option>
        <option value="mt">Maltese</option>
        <option value="mi">Maori</option>
        <option value="mr">Marathi</option>
        <option value="mn">Mongolian</option>
        <option value="my">Burmese</option>
        <option value="ne">Nepali</option>
        <option value="no">Norwegian</option>
        <option value="ps">Pashto</option>
        <option value="fa">Persian</option>
        <option value="pl">Polish</option>
        <option value="pt">Portuguese</option>
        <option value="pa">Punjabi</option>
        <option value="ro">Romanian</option>
        <option value="ru">Russian</option>
        <option value="sm">Samoan</option>
        <option value="gd">Scottish Gaelic</option>
        <option value="sr">Serbian</option>
        <option value="st">Sesotho</option>
        <option value="sn">Shona</option>
        <option value="sd">Sindhi</option>
        <option value="si">Sinhala</option>
        <option value="sk">Slovak</option>
        <option value="sl">Slovenian</option>
        <option value="so">Somali</option>
        <option value="es">Spanish</option>
        <option value="su">Sundanese</option>
        <option value="sw">Swahili</option>
        <option value="sv">Swedish</option>
        <option value="tg">Tajik</option>
        <option value="ta">Tamil</option>
        <option value="te">Telugu</option>
        <option value="th">Thai</option>
        <option value="tr">Turkish</option>
        <option value="uk">Ukrainian</option>
        <option value="ur">Urdu</option>
        <option value="uz">Uzbek</option>
        <option value="vi">Vietnamese</option>
        <option value="cy">Welsh</option>
        <option value="xh">Xhosa</option>
        <option value="yi">Yiddish</option>
        <option value="yo">Yoruba</option>
        <option value="zu">Zulu</option>
      </select>
    </div>

    <div class="output-box">
      <textarea id="translatedText" readonly placeholder="Translated text will appear here..."></textarea>
      <button class="copy-btn" id="copyBtn"><i class="fas fa-copy"></i> Copy</button>
    </div>

    <div id="loading">Translating, please wait...</div>
    <div id="error">Error: Translation failed. Please try again.</div>
  </div>

  <script>
    const inputText = document.getElementById('inputText');
    const targetLanguage = document.getElementById('targetLanguage');
    const translatedText = document.getElementById('translatedText');
    const translateBtn = document.getElementById('translateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const loadingElement = document.getElementById('loading');
    const errorElement = document.getElementById('error');

    // Translate button click event
    translateBtn.addEventListener('click', async () => {
      const text = inputText.value.trim();
      const language = targetLanguage.value;

      if (!text) {
        alert('Please enter some text to translate.');
        return;
      }

      // Reset UI
      translatedText.value = '';
      errorElement.style.display = 'none';
      loadingElement.style.display = 'block';

      try {
        // Step 1: Detect the input language
        const detectResponse = await fetch(
          `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`
        );
        const detectData = await detectResponse.json();
        const detectedLanguage = detectData[2]; // Detected language code

        // Step 2: Translate the text to the target language
        const translateResponse = await fetch(
          `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${detectedLanguage}&tl=${language}&dt=t&q=${encodeURIComponent(text)}`
        );
        const translateData = await translateResponse.json();
        const translatedTextResult = translateData[0][0][0];

        // Display the translated text
        translatedText.value = translatedTextResult;
      } catch (error) {
        console.error('Error translating text:', error);
        errorElement.style.display = 'block';
      } finally {
        loadingElement.style.display = 'none';
      }
    });

    // Copy button click event
    copyBtn.addEventListener('click', () => {
      if (!translatedText.value) {
        alert('No translated text to copy.');
        return;
      }
      translatedText.select();
      document.execCommand('copy');
      alert('Copied to clipboard!');
    });
  </script>
</body>
</html>
