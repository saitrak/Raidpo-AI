<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raidpo AI - Background Remover</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background-color: #0f0f0f;
      text-align: center;
    }
    .container {
      padding: 2rem;
    }
    .upload-box {
      border: 2px dashed #ff6f61;
      padding: 2rem;
      border-radius: 10px;
      margin: 2rem auto;
      max-width: 400px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
    }
    .upload-box:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .upload-box input {
      display: none;
    }
    .btn {
      background: #ff6f61;
      padding: 1rem 2rem;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
    }
    .output {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
    }
    .output img {
      max-width: 300px;
      border-radius: 10px;
    }
    .comparison {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
    }
    .comparison img {
      max-width: 300px;
      border-radius: 10px;
    }
    .download-btn {
      background: #28a745;
      padding: 1rem 2rem;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
      display: none;
    }
    .ads-container {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Raidpo AI - Background Remover</h1>
    <p>Remove image backgrounds instantly with AI-powered precision.</p>
    <label class="upload-box">
      <p>Click to upload or drag & drop</p>
      <input type="file" id="fileInput" accept="image/*" onchange="previewImage()">
    </label>
    <button class="btn" onclick="removeBg()">Remove Background</button>
    <div class="comparison" id="comparison"></div>
    <div class="output" id="output"></div>
    <button class="download-btn" id="downloadBtn" onclick="downloadImage()">Download Image</button>
    <div class="ads-container">
      <!-- Google AdSense Placeholder -->
      <p>Advertisement</p>
      <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>
  </div>

  <script>
    function previewImage() {
      const fileInput = document.getElementById('fileInput');
      const comparisonDiv = document.getElementById('comparison');
      if (!fileInput.files.length) return;
      const reader = new FileReader();
      reader.onload = function (event) {
        comparisonDiv.innerHTML = `<img src="${event.target.result}" alt="Original Image">`;
      };
      reader.readAsDataURL(fileInput.files[0]);
    }
    
    async function removeBg() {
      const fileInput = document.getElementById('fileInput');
      const outputDiv = document.getElementById('output');
      const downloadBtn = document.getElementById('downloadBtn');
      if (!fileInput.files.length) {
        alert('Please upload an image first!');
        return;
      }
      const formData = new FormData();
      formData.append('image_file', fileInput.files[0]);
      formData.append('size', 'auto');
      try {
        const response = await fetch('https://api.remove.bg/v1.0/removebg', {
          method: 'POST',
          headers: { 'X-Api-Key': 'YOUR_REMOVE_BG_API_KEY' },
          body: formData
        });
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        outputDiv.innerHTML = `<img src="${url}" alt="Processed Image">`;
        downloadBtn.style.display = 'block';
        downloadBtn.setAttribute('data-url', url);
      } catch (error) {
        alert('Failed to remove background. Please try again.');
      }
    }
    
    function downloadImage() {
      const downloadBtn = document.getElementById('downloadBtn');
      const url = downloadBtn.getAttribute('data-url');
      if (!url) {
        alert('No image available to download!');
        return;
      }
      const link = document.createElement('a');
      link.href = url;
      link.download = 'bg_removed.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
