<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raidpo AI - Background Remover</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background-color: #0f0f0f;
    }

    .hero {
      text-align: center;
      padding: 6rem 2rem;
      background: linear-gradient(135deg, #ff6f61, #ff3b2f);
    }

    .tool-container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .upload-box {
      border: 2px dashed #ff6f61;
      padding: 3rem;
      border-radius: 20px;
      margin: 2rem auto;
      max-width: 600px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .upload-box:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }

    .upload-box i {
      font-size: 2.5rem;
      color: #ff6f61;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin: 3rem auto;
      max-width: 1000px;
    }

    .image-card {
      background: #1a1a1a;
      border-radius: 15px;
      padding: 1rem;
      position: relative;
      transition: transform 0.3s;
    }

    .image-card img {
      width: 100%;
      height: 400px;
      object-fit: contain;
      border-radius: 10px;
    }

    .process-btn {
      padding: 1rem 2rem;
      background: #fff;
      color: #ff3b2f;
      border-radius: 50px;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
      margin: 1rem auto;
      display: block;
      transition: all 0.3s;
    }

    .process-btn:hover {
      background: #ff6f61;
      color: #fff;
      transform: scale(1.05);
    }

    .download-btn {
      padding: 1rem 2rem;
      background: #28a745;
      color: #fff;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      margin: 1rem auto;
      display: none;
      transition: transform 0.3s;
    }

    .download-btn:hover {
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Background Remover</h1>
    <p>Remove backgrounds from images instantly with AI</p>
  </section>

  <div class="tool-container">
    <label class="upload-box">
      <i class="fas fa-cloud-upload-alt"></i>
      <p id="uploadText">Drag & drop image or click to upload</p>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </label>

    <button class="process-btn" id="processBtn">Remove Background</button>

    <div class="comparison-grid">
      <div class="image-card">
        <img id="originalImage" alt="Original">
      </div>
      <div class="image-card">
        <img id="resultImage" alt="Result">
      </div>
    </div>

    <button class="download-btn" id="downloadBtn">Download Result</button>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const originalImage = document.getElementById('originalImage');
    const resultImage = document.getElementById('resultImage');
    const uploadText = document.getElementById('uploadText');
    let processedUrl = null;

    // Drag and drop handlers
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => {
      e.preventDefault();
      fileInput.files = e.dataTransfer.files;
      handleFileSelect();
    });

    fileInput.addEventListener('change', handleFileSelect);

    function handleFileSelect() {
      if (!fileInput.files.length) return;
      
      const reader = new FileReader();
      reader.onload = e => {
        originalImage.src = e.target.result;
        resultImage.src = '';
        downloadBtn.style.display = 'none';
        uploadText.textContent = fileInput.files[0].name + ' uploaded!'; // Show file name
      };
      reader.readAsDataURL(fileInput.files[0]);
    }

    async function processImage() {
      if (!fileInput.files.length) return alert('Please select an image first!');
      
      processBtn.disabled = true;
      processBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

      const formData = new FormData();
      formData.append('image_file', fileInput.files[0]);
      formData.append('size', 'auto');

      try {
        const response = await fetch('https://api.remove.bg/v1.0/removebg', {
          method: 'POST',
          headers: { 
            'X-Api-Key': 'LaxUrs7VpsHAdAh7ibaYJeVw'
          },
          body: formData
        });

        if (!response.ok) throw new Error('Failed to process image');
        
        const blob = await response.blob();
        processedUrl = URL.createObjectURL(blob);
        resultImage.src = processedUrl;
        downloadBtn.style.display = 'block';
      } catch (error) {
        alert('Error: ' + error.message);
      } finally {
        processBtn.disabled = false;
        processBtn.innerHTML = 'Remove Background';
      }
    }

    function downloadResult() {
      if (!processedUrl) return alert('No processed image available!');
      const link = document.createElement('a');
      link.href = processedUrl;
      link.download = 'background-removed.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Event listeners
    processBtn.addEventListener('click', processImage);
    downloadBtn.addEventListener('click', downloadResult);
  </script>
</body>
</html>
