<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email</title>
    <style>
        /* --- Global Styles & Resets --- */
        :root {
            --primary-color: #4a90e2; /* A nice blue */
            --success-color: #2ecc71; /* Green */
            --error-color: #e74c3c;   /* Red */
            --light-gray: #f4f7f6;
            --dark-gray: #333333;
            --white: #ffffff;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--light-gray);
        }

        /* --- Main Card Container --- */
        .verification-card {
            background: var(--white);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: all 0.3s ease;
        }

        /* --- Icon Styling --- */
        .icon-container {
            margin-bottom: 20px;
        }

        .icon {
            width: 80px;
            height: 80px;
            display: none; /* Hidden by default */
        }

        #icon-success .circle {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 0.8s ease-in-out forwards;
        }

        #icon-success .tick {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 0.8s ease-in-out 0.3s forwards;
        }
        
        #icon-error .circle {
             stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 0.8s ease-in-out forwards;
        }
        
        #icon-error .cross {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 0.8s ease-in-out 0.3s forwards;
        }


        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* --- Loader Animation --- */
        .loader {
            border: 5px solid #f3f3f3; /* Light grey */
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Status Message & Button --- */
        #status-message {
            font-size: 1.2em;
            color: var(--dark-gray);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        #proceed-button {
            display: none; /* Hidden by default */
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
            text-decoration: none;
        }

        #proceed-button:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="verification-card">
        <div class="icon-container">
            <!-- Loader: Shown initially -->
            <div class="loader" id="loader"></div>
            
            <!-- Success Icon: Shown on success -->
            <svg class="icon" id="icon-success" viewBox="0 0 52 52">
                <circle class="circle" cx="26" cy="26" r="25" fill="none" stroke="var(--success-color)" stroke-width="3"/>
                <path class="tick" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" stroke="var(--success-color)" stroke-width="4"/>
            </svg>

            <!-- Error Icon: Shown on error -->
            <svg class="icon" id="icon-error" viewBox="0 0 52 52">
              <circle class="circle" cx="26" cy="26" r="25" fill="none" stroke="var(--error-color)" stroke-width="3"/>
              <path class="cross" fill="none" d="M16 16 36 36 M36 16 16 36" stroke="var(--error-color)" stroke-width="4"/>
            </svg>
        </div>
        
        <h2 id="status-title">Verifying Email</h2>
        <p id="status-message">Please wait while we verify your email address...</p>

        <a href="#" id="proceed-button">Proceed to App</a>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js"></script>

    <script>
        // --- YOUR FIREBASE CONFIGURATION ---
        const firebaseConfig = {
          apiKey: "AIzaSyBnXZuupUuEU-YQINri3isg_k2av1p4bHY",
          authDomain: "raidpo-ai-3c84b.firebaseapp.com",
          projectId: "raidpo-ai-3c84b",
          storageBucket: "raidpo-ai-3c84b.firebasestorage.app",
          messagingSenderId: "41213161184",
          appId: "1:41213161184:web:58604fc48f2c026f5aaa85",
          measurementId: "G-7MBZHVFCZR"
        };
        
        // --- REDIRECT URL AFTER SUCCESS ---
        const redirectUrl = "https://raidpo-ai.netlify.app";

        // --- JAVASCRIPT LOGIC ---
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Initialize Firebase
            const app = firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();

            // 2. Get DOM elements
            const loader = document.getElementById('loader');
            const iconSuccess = document.getElementById('icon-success');
            const iconError = document.getElementById('icon-error');
            const statusTitle = document.getElementById('status-title');
            const statusMessage = document.getElementById('status-message');
            const proceedButton = document.getElementById('proceed-button');

            // 3. Get the action code from the URL
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            const actionCode = urlParams.get('oobCode');

            // 4. Handle the verification
            if (mode === 'verifyEmail' && actionCode) {
                handleVerifyEmail(auth, actionCode);
            } else {
                displayError("Invalid Request", "The verification link is missing necessary information. Please use the link from your email.");
            }

            // --- Function to handle the email verification ---
            function handleVerifyEmail(auth, actionCode) {
                auth.applyActionCode(actionCode)
                    .then(() => {
                        // Success
                        displaySuccess();
                        
                        // Set a timeout to redirect the user
                        setTimeout(() => {
                            window.location.href = redirectUrl;
                        }, 4000); // 4-second delay to allow user to read message
                        
                    })
                    .catch((error) => {
                        // Error
                        let title = "Verification Failed";
                        let message = "An unknown error occurred.";
                        
                        // Provide more specific error messages
                        if (error.code === 'auth/invalid-action-code') {
                            message = "The verification link is invalid or has expired. It may have already been used. Please request a new verification email.";
                        }
                        
                        displayError(title, message);
                    });
            }

            // --- UI Helper Functions ---
            function displaySuccess() {
                loader.style.display = 'none';
                iconSuccess.style.display = 'block';
                statusTitle.textContent = "Success!";
                statusMessage.textContent = "Your email has been verified. You will be redirected shortly.";
                proceedButton.style.display = 'inline-block';
                proceedButton.href = redirectUrl;
            }

            function displayError(title, message) {
                loader.style.display = 'none';
                iconError.style.display = 'block';
                statusTitle.textContent = title;
                statusMessage.textContent = message;
            }
        });
    </script>
</body>
</html>
