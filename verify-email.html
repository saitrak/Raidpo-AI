<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raidpo-AI Email Verification</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary: #6c5ce7;
            --primary-dark: #5649c0;
            --secondary: #00cec9;
            --danger: #ff7675;
            --success: #00b894;
            --dark: #2d3436;
            --light: #f5f6fa;
            --white: #ffffff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background-color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .verification-container {
            background-color: var(--white);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: all 0.5s ease;
        }
        
        .verification-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: var(--primary);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .logo h1 span {
            color: var(--secondary);
        }
        
        .verification-content {
            text-align: center;
        }
        
        .verification-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
            position: relative;
        }
        
        .circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid rgba(108, 92, 231, 0.2);
            position: absolute;
            top: 0;
            left: 0;
            animation: pulse 2s infinite;
        }
        
        .inner-circle {
            width: 80px;
            height: 80px;
            background-color: var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 20px;
            left: 20px;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }
        
        .inner-circle i {
            color: var(--white);
            font-size: 40px;
        }
        
        .verification-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 15px;
        }
        
        .verification-message {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .verification-progress {
            width: 100%;
            height: 8px;
            background-color: rgba(108, 92, 231, 0.1);
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .verification-status {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .action-button {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: var(--white);
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
            margin-top: 20px;
        }
        
        .action-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.6);
        }
        
        .success-state .inner-circle {
            background-color: var(--success);
            box-shadow: 0 5px 15px rgba(0, 184, 148, 0.4);
        }
        
        .success-state .circle {
            border-color: rgba(0, 184, 148, 0.2);
            animation: none;
        }
        
        .success-state .progress-bar {
            background: linear-gradient(90deg, var(--success), var(--secondary));
            width: 100% !important;
        }
        
        .expired-state .inner-circle {
            background-color: var(--danger);
            box-shadow: 0 5px 15px rgba(255, 118, 117, 0.4);
        }
        
        .expired-state .circle {
            border-color: rgba(255, 118, 117, 0.2);
            animation: none;
        }
        
        .expired-state .progress-bar {
            background: linear-gradient(90deg, var(--danger), #e84393);
            width: 100% !important;
        }
        
        .hidden {
            display: none;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        @keyframes checkmark {
            0% {
                stroke-dashoffset: 50;
            }
            100% {
                stroke-dashoffset: 0;
            }
        }
        
        .checkmark {
            width: 40px;
            height: 40px;
        }
        
        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: var(--white);
            fill: none;
            animation: checkmark 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        
        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: var(--white);
            fill: none;
            animation: checkmark 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }
        
        .expired-icon {
            width: 40px;
            height: 40px;
            position: relative;
        }
        
        .expired-icon::before,
        .expired-icon::after {
            content: '';
            position: absolute;
            height: 40px;
            width: 2px;
            background-color: var(--white);
            top: 0;
            left: 19px;
        }
        
        .expired-icon::before {
            transform: rotate(45deg);
        }
        
        .expired-icon::after {
            transform: rotate(-45deg);
        }
        
        .countdown {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 20px;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid var(--white);
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="verification-container" id="verificationContainer">
        <div class="logo">
            <h1>Raidpo<span>-AI</span></h1>
        </div>
        
        <div class="verification-content">
            <div class="verification-icon">
                <div class="circle"></div>
                <div class="inner-circle">
                    <i class="fas fa-envelope"></i>
                </div>
            </div>
            
            <h2 class="verification-title">Verifying Your Email</h2>
            <p class="verification-message" id="verificationMessage">We're verifying your email address. Please wait...</p>
            
            <div class="verification-progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            
            <div class="verification-status" id="verificationStatus">Checking verification link...</div>
            
            <button class="action-button hidden" id="continueButton">
                <span id="buttonText">Continue to Homepage</span>
                <div class="loading-spinner hidden" id="buttonSpinner"></div>
            </button>
            <button class="action-button hidden" id="resendButton">
                <span id="resendButtonText">Resend Verification Email</span>
                <div class="loading-spinner hidden" id="resendSpinner"></div>
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBnXZuupUuEU-YQINri3isg_k2av1p4bHY",
            authDomain: "raidpo-ai-3c84b.firebaseapp.com",
            projectId: "raidpo-ai-3c84b",
            storageBucket: "raidpo-ai-3c84b.firebasestorage.app",
            messagingSenderId: "41213161184",
            appId: "1:41213161184:web:58604fc48f2c026f5aaa85",
            measurementId: "G-7MBZHVFCZR"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // DOM elements
        const verificationContainer = document.getElementById('verificationContainer');
        const progressBar = document.getElementById('progressBar');
        const verificationStatus = document.getElementById('verificationStatus');
        const verificationMessage = document.getElementById('verificationMessage');
        const continueButton = document.getElementById('continueButton');
        const resendButton = document.getElementById('resendButton');
        const buttonText = document.getElementById('buttonText');
        const buttonSpinner = document.getElementById('buttonSpinner');
        const resendButtonText = document.getElementById('resendButtonText');
        const resendSpinner = document.getElementById('resendSpinner');

        // Homepage URL
        const HOMEPAGE_URL = "https://raidpo-ai.netlify.app";

        // Extract action code from URL
        function getActionCodeFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('oobCode');
        }

        // Update progress bar
        function updateProgress(percent, message) {
            progressBar.style.width = `${percent}%`;
            verificationStatus.textContent = message;
        }

        // Show success state
        function showSuccessState() {
            verificationContainer.classList.add('success-state');
            
            const innerCircle = document.querySelector('.inner-circle');
            innerCircle.innerHTML = `
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            `;
            
            document.querySelector('.verification-title').textContent = "Verification Complete!";
            verificationMessage.textContent = "Your email address has been successfully verified.";
            updateProgress(100, "Email verified successfully!");
            
            continueButton.classList.remove('hidden');
            
            continueButton.addEventListener('click', redirectToHomepage);
        }

        // Show expired state
        function showExpiredState() {
            verificationContainer.classList.add('expired-state');
            
            const innerCircle = document.querySelector('.inner-circle');
            innerCircle.innerHTML = '<div class="expired-icon"></div>';
            
            document.querySelector('.verification-title').textContent = "Link Expired";
            verificationMessage.textContent = "This verification link is no longer valid. Please request a new verification email.";
            updateProgress(100, "Verification link has expired");
            
            resendButton.classList.remove('hidden');
            
            resendButton.addEventListener('click', resendVerificationEmail);
        }

        // Show error state
        function showErrorState(errorMessage) {
            verificationContainer.classList.add('expired-state');
            
            const innerCircle = document.querySelector('.inner-circle');
            innerCircle.innerHTML = '<div class="expired-icon"></div>';
            
            document.querySelector('.verification-title').textContent = "Verification Failed";
            verificationMessage.textContent = errorMessage || "An error occurred during verification.";
            updateProgress(100, "Verification process failed");
            
            resendButton.classList.remove('hidden');
            resendButton.addEventListener('click', resendVerificationEmail);
        }

        // Redirect to homepage
        function redirectToHomepage() {
            buttonText.classList.add('hidden');
            buttonSpinner.classList.remove('hidden');
            
            // In a real app, you might want to check auth state first
            setTimeout(() => {
                window.location.href = HOMEPAGE_URL;
            }, 1500);
        }

        // Resend verification email
        async function resendVerificationEmail() {
            resendButtonText.classList.add('hidden');
            resendSpinner.classList.remove('hidden');
            resendButton.disabled = true;
            
            try {
                const user = auth.currentUser;
                if (!user) {
                    throw new Error("No user found. Please sign in again.");
                }
                
                await user.sendEmailVerification();
                
                verificationStatus.textContent = "New verification email sent! Please check your inbox.";
                resendButtonText.textContent = "Email Sent!";
                
                setTimeout(() => {
                    resendButtonText.textContent = "Resend Verification Email";
                    resendButton.disabled = false;
                    resendButtonText.classList.remove('hidden');
                    resendSpinner.classList.add('hidden');
                }, 3000);
            } catch (error) {
                console.error("Error resending verification email:", error);
                verificationStatus.textContent = "Failed to resend email: " + error.message;
                resendButtonText.textContent = "Try Again";
                resendButton.disabled = false;
                resendButtonText.classList.remove('hidden');
                resendSpinner.classList.add('hidden');
            }
        }

        // Handle email verification
        async function handleEmailVerification(actionCode) {
            try {
                updateProgress(20, "Verifying your email...");
                
                // Apply the verification code
                await auth.applyActionCode(actionCode);
                
                updateProgress(60, "Email verified. Updating your account...");
                
                // Get the current user (should be logged in after verification)
                const user = auth.currentUser;
                
                if (user) {
                    // Reload user to get updated emailVerified status
                    await user.reload();
                    
                    if (user.emailVerified) {
                        updateProgress(100, "Finalizing verification...");
                        setTimeout(showSuccessState, 1000);
                    } else {
                        throw new Error("Email still not verified after applying action code");
                    }
                } else {
                    throw new Error("No user authenticated after verification");
                }
            } catch (error) {
                console.error("Email verification error:", error);
                
                // Handle specific error cases
                if (error.code === 'auth/expired-action-code') {
                    showExpiredState();
                } else if (error.code === 'auth/invalid-action-code') {
                    showErrorState("Invalid verification link. Please request a new one.");
                } else if (error.code === 'auth/user-disabled') {
                    showErrorState("This account has been disabled.");
                } else if (error.code === 'auth/user-not-found') {
                    showErrorState("No account found with this email.");
                } else {
                    showErrorState(error.message);
                }
            }
        }

        // Main initialization
        document.addEventListener('DOMContentLoaded', async () => {
            const actionCode = getActionCodeFromUrl();
            
            if (actionCode) {
                // We have a verification code in the URL
                await handleEmailVerification(actionCode);
            } else {
                // No verification code - check if user is already verified
                auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        if (user.emailVerified) {
                            // User is already verified
                            showSuccessState();
                        } else {
                            // User not verified and no action code
                            showErrorState("No verification link found. Please check your email for the verification link.");
                        }
                    } else {
                        // No user signed in
                        showErrorState("Please sign in to verify your email.");
                    }
                });
            }
        });
    </script>
</body>
</html>
