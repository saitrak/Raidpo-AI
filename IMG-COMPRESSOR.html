<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Compress your images online with our fully responsive image compression tool. Optimize images for web use with adjustable compression levels.">
  <meta name="keywords" content="image compression, optimize images, image optimizer, online image compressor">
  <meta name="author" content="Saif">
  <title>Riadpo AI - Ultra Image Compressor</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background-color: #0f0f0f;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 6rem 2rem;
      background: linear-gradient(135deg, #ff6f61, #ff3b2f);
    }

    .hero h1 {
      font-size: 2.5rem;
      margin: 0;
    }

    .hero p {
      font-size: 1rem;
      margin: 5px 0;
    }

    /* Tool Container */
    .tool-container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    /* Upload Box */
    .upload-box {
      border: 2px dashed #ff6f61;
      padding: 3rem;
      border-radius: 20px;
      margin: 2rem auto;
      max-width: 600px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .upload-box:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }

    .upload-box i {
      font-size: 2.5rem;
      color: #ff6f61;
    }

    .upload-box p {
      margin: 0;
    }

    /* Compression Level */
    #compression-level-container {
      margin-top: 15px;
      text-align: center;
    }

    #compression-level-label {
      font-size: 1rem;
      color: #fff;
    }

    #compression-level {
      width: 80%;
      margin-top: 10px;
    }

    /* Buttons */
    .process-btn {
      padding: 1rem 2rem;
      background: #fff;
      color: #ff3b2f;
      border-radius: 50px;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
      margin: 1rem auto;
      display: block;
      transition: all 0.3s;
    }

    .process-btn:hover {
      background: #ff6f61;
      color: #fff;
      transform: scale(1.05);
    }

    .download-btn {
      padding: 1rem 2rem;
      background: #28a745;
      color: #fff;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      margin: 1rem auto;
      display: none;
      transition: transform 0.3s;
    }

    .download-btn:hover {
      transform: translateY(-3px);
    }

    /* Comparison Grid */
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin: 3rem auto;
      max-width: 1000px;
    }

    .image-card {
      background: #1a1a1a;
      border-radius: 15px;
      padding: 1rem;
      position: relative;
      transition: transform 0.3s;
    }

    .image-card img {
      width: 100%;
      height: 400px;
      object-fit: contain;
      border-radius: 10px;
    }

    .image-card p {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #ccc;
      text-align: center;
    }

    /* Footer */
    footer {
      padding: 2rem;
      background-color: #0f0f0f;
      text-align: center;
    }

    footer p {
      margin: 0;
      font-size: 0.9rem;
    }

    footer a {
      color: #ff6f61;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Hero Section -->
  <section class="hero">
    <h1>Riadpo AI</h1>
    <p>Ultra Image Compressor</p>
    <p>Creator: Saif | 100% Free</p>
  </section>

  <!-- Tool Container -->
  <div class="tool-container">
    <!-- Upload Box -->
    <label class="upload-box">
      <i class="fas fa-cloud-upload-alt"></i>
      <p id="uploadText">Drag & drop image or click to upload</p>
      <input type="file" id="image-input" accept="image/*" hidden>
    </label>

    <!-- Compression Level -->
    <div id="compression-level-container">
      <label id="compression-level-label" for="compression-level">Compression Level: <span id="compression-value">5</span></label>
      <input type="range" id="compression-level" min="1" max="10" value="5">
    </div>

    <!-- Compress Button -->
    <button class="process-btn" id="compress-btn">Compress Image</button>

    <!-- Comparison Grid -->
    <div class="comparison-grid">
      <div class="image-card">
        <img id="original-image" src="" alt="Original Image">
        <p>Original Image</p>
      </div>
      <div class="image-card">
        <img id="compressed-image" src="" alt="Compressed Image">
        <p>Compressed Image</p>
      </div>
    </div>

    <!-- Download Button -->
    <a class="download-btn" id="download-link" download="compressed-image.jpg">Download Compressed Image</a>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Riadpo AI. All rights reserved.</p>
    <p>Created by <a href="#" target="_blank">Saif</a> | 100% Free to Use</p>
  </footer>

  <script>
    // JavaScript Functionality
    const compressionLevelInput = document.getElementById('compression-level');
    const compressionValue = document.getElementById('compression-value');
    const originalImage = document.getElementById('original-image');
    const compressedImage = document.getElementById('compressed-image');
    const downloadLink = document.getElementById('download-link');
    const uploadText = document.getElementById('uploadText');

    // Update compression level value display
    compressionLevelInput.addEventListener('input', function() {
      compressionValue.textContent = this.value;
    });

    // Compress Image Functionality
    document.getElementById('compress-btn').addEventListener('click', function() {
      const fileInput = document.getElementById('image-input');
      const compressionLevel = parseFloat(compressionLevelInput.value);

      if (fileInput.files.length === 0) {
        alert('Please select an image to compress.');
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(event) {
        const img = new Image();
        img.src = event.target.result;

        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          canvas.width = img.width;
          canvas.height = img.height;

          ctx.drawImage(img, 0, 0);

          // Adjust compression logic
          const quality = 1 - (compressionLevel * 0.1); // Step-by-step reduction
          canvas.toBlob(function(blob) {
            const compressedUrl = URL.createObjectURL(blob);

            // Display original and compressed images
            originalImage.src = img.src;
            compressedImage.src = compressedUrl;

            // Enable download button
            downloadLink.href = compressedUrl;
            downloadLink.download = `compressed-image-${Date.now()}.jpg`; // Dynamic filename
            downloadLink.style.display = 'block';
          }, 'image/jpeg', quality);
        };
      };

      reader.readAsDataURL(file);
    });

    // Update upload text
    document.getElementById('image-input').addEventListener('change', function() {
      if (this.files.length > 0) {
        uploadText.textContent = this.files[0].name + ' uploaded!';
      }
    });
  </script>
</body>
</html>
