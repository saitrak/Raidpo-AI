<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compress your images online with our fully responsive image compression tool. Optimize images for web use with adjustable compression levels.">
    <meta name="keywords" content="image compression, optimize images, image optimizer, online image compressor">
    <meta name="author" content="Saif">
    <title>Riadpo AI - Ultra Image Compressor</title>
    <style>
        /* Super Ultra Max Attractive Black Theme CSS */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
            color: #ff9f43;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            margin: 5px 0;
            color: #ccc;
            font-size: 1rem;
        }

        main {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        #upload-section {
            margin-bottom: 20px;
        }

        #upload-section input[type="file"] {
            display: none;
        }

        #upload-section label {
            display: inline-block;
            background: #ff9f43;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        #upload-section label:hover {
            background: #ff7f00;
        }

        #compression-level-container {
            margin-top: 15px;
            text-align: left;
        }

        #compression-level-label {
            display: block;
            margin-bottom: 10px;
            font-size: 1rem;
            color: #fff;
        }

        #compression-level {
            width: 100%;
            margin-top: 5px;
        }

        #compress-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #00b894;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
            width: 100%;
        }

        #compress-btn:hover {
            background: #00cec9;
        }

        #result-section {
            margin-top: 20px;
            display: none;
        }

        #comparison-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .image-container {
            width: 48%;
            text-align: center;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .image-container p {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ccc;
        }

        #download-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #0984e3;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        #download-link:hover {
            background: #74b9ff;
        }

        .ad-unit {
            margin-top: 20px;
            text-align: center;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            color: #fff;
            font-size: 0.9rem;
        }

        footer a {
            color: #ff9f43;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Modal for Image Preview */
        #image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #modal-image {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }

        #close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
        }
    </style>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_AD_UNIT_ID" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>Riadpo AI</h1>
        <p>Ultra Image Compressor</p>
        <p>Creator: Saif | 100% Free</p>
    </header>
    <main>
        <section id="upload-section">
            <input type="file" id="image-input" accept="image/*">
            <label for="image-input">Choose Image</label>
            <div id="compression-level-container">
                <label id="compression-level-label" for="compression-level">Compression Level: <span id="compression-value">5</span></label>
                <input type="range" id="compression-level" min="1" max="10" value="5">
            </div>
            <button id="compress-btn">Compress Image</button>
        </section>
        <section id="result-section">
            <h2>Compressed Image</h2>
            <div id="comparison-container">
                <div class="image-container">
                    <img id="original-image" src="" alt="Original Image">
                    <p>Original Image</p>
                </div>
                <div class="image-container">
                    <img id="compressed-image" src="" alt="Compressed Image">
                    <p>Compressed Image</p>
                </div>
            </div>
            <a id="download-link" href="#" download="compressed-image.jpg">Download Compressed Image</a>
        </section>
        <!-- AdSense Ad Unit -->
        <div class="ad-unit">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-YOUR_AD_UNIT_ID"
                 data-ad-slot="1234567890"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Riadpo AI. All rights reserved.</p>
        <p>Created by <a href="#" target="_blank">Saif</a> | 100% Free to Use</p>
    </footer>

    <!-- Image Preview Modal -->
    <div id="image-modal">
        <span id="close-modal">&times;</span>
        <img id="modal-image" src="" alt="Preview">
    </div>

    <script>
        // JavaScript Functionality
        const compressionLevelInput = document.getElementById('compression-level');
        const compressionValue = document.getElementById('compression-value');
        const originalImage = document.getElementById('original-image');
        const compressedImage = document.getElementById('compressed-image');
        const downloadLink = document.getElementById('download-link');
        const resultSection = document.getElementById('result-section');

        // Update compression level value display
        compressionLevelInput.addEventListener('input', function() {
            compressionValue.textContent = this.value;
        });

        document.getElementById('compress-btn').addEventListener('click', function() {
            const fileInput = document.getElementById('image-input');
            const compressionLevel = parseFloat(compressionLevelInput.value);

            if (fileInput.files.length === 0) {
                alert('Please select an image to compress.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;

                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    canvas.width = img.width;
                    canvas.height = img.height;

                    ctx.drawImage(img, 0, 0);

                    // Adjust compression logic
                    const quality = 1 - (compressionLevel * 0.1); // Step-by-step reduction
                    canvas.toBlob(function(blob) {
                        const compressedUrl = URL.createObjectURL(blob);
                        originalImage.src = img.src; // Show original image
                        compressedImage.src = compressedUrl; // Show compressed image
                        downloadLink.href = compressedUrl;
                        resultSection.style.display = 'block';
                    }, 'image/jpeg', quality);
                };
            };

            reader.readAsDataURL(file);
        });

        // Image Preview Modal
        const imageModal = document.getElementById('image-modal');
        const modalImage = document.getElementById('modal-image');
        const closeModal = document.getElementById('close-modal');

        compressedImage.addEventListener('click', function() {
            modalImage.src = compressedImage.src;
            imageModal.style.display = 'flex';
        });

        closeModal.addEventListener('click', function() {
            imageModal.style.display = 'none';
        });

        window.addEventListener('click', function(event) {
            if (event.target === imageModal) {
                imageModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
