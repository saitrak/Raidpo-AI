<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Raidpo AI</title>
    <!-- Favicon link: Assumes you have a favicon.ico in your root directory -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        /* Import Google Font - Poppins */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        /* Define CSS Variables for easy theme customization */
        :root {
            --bg-color: #1a1a2e; /* Dark background similar to a modern tech theme */
            --text-color: #e0e0e0; /* Light text for contrast */
            --accent-color: #007bff; /* A vibrant blue for accents and buttons */
            --button-hover-color: #0056b3; /* Darker blue on button hover */
            --container-bg: #282844; /* Slightly lighter dark background for the content container */
            --border-radius: 8px; /* Rounded corners for elements */
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.3); /* Subtle shadow for depth */
        }

        /* Base Body Styles */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Full viewport height */
            margin: 0;
            overflow: hidden; /* Prevent scrollbars due to particle animation */
            text-align: center;
            position: relative; /* Needed for absolute positioning of particles */
        }

        /* Main Content Container */
        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            max-width: 600px;
            width: 90%; /* Responsive width */
            animation: fadeIn 1s ease-out; /* Fade-in animation on load */
            position: relative;
            z-index: 10; /* Ensure content is above background particles */
        }

        /* Heading Styles */
        h1 {
            font-size: 5em; /* Large 404 number */
            margin-bottom: 10px;
            color: var(--accent-color);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); /* Subtle text shadow */
            animation: bounceIn 0.8s ease-out; /* Bounce effect for the 404 number */
        }

        h2 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #b0b0b0; /* Slightly desaturated text for paragraphs */
        }

        /* Home Button Styles */
        .home-button {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 12px 25px;
            border-radius: 50px; /* Pill-shaped button */
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1em;
            transition: background-color 0.3s ease, transform 0.2s ease; /* Smooth hover effects */
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.4); /* Button shadow */
        }

        .home-button:hover {
            background-color: var(--button-hover-color);
            transform: translateY(-2px); /* Slight lift on hover */
        }

        /* Background Particle Animation (Pure CSS) */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicks to pass through particles */
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.1); /* Semi-transparent white particles */
            border-radius: 50%;
            animation: float 15s infinite ease-in-out; /* Floating animation */
        }

        /* Individual particle sizing and positioning for variety */
        .particle:nth-child(1) { width: 15px; height: 15px; top: 10%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 10px; height: 10px; top: 20%; left: 80%; animation-delay: 2s; }
        .particle:nth-child(3) { width: 20px; height: 20px; top: 50%; left: 30%; animation-delay: 4s; }
        .particle:nth-child(4) { width: 12px; height: 12px; top: 70%; left: 60%; animation-delay: 6s; }
        .particle:nth-child(5) { width: 18px; height: 18px; top: 90%; left: 20%; animation-delay: 8s; }
        .particle:nth-child(6) { width: 8px; height: 8px; top: 40%; left: 90%; animation-delay: 10s; }
        .particle:nth-child(7) { width: 14px; height: 14px; top: 60%; left: 5%; animation-delay: 12s; }
        .particle:nth-child(8) { width: 16px; height: 16px; top: 30%; left: 45%; animation-delay: 14s; }

        /* Keyframe Animations */
        @keyframes float {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0.8; }
            50% { transform: translateY(-20px) translateX(20px) scale(1.1); opacity: 0.5; }
            100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.8; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0%, 20%, 40%, 60%, 80%, 100% {
                transition-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
            }
            0% {
                opacity: 0;
                transform: scale3d(0.3, 0.3, 0.3);
            }
            20% {
                transform: scale3d(1.1, 1.1, 1.1);
            }
            40% {
                transform: scale3d(0.9, 0.9, 0.9);
            }
            60% {
                opacity: 1;
                transform: scale3d(1.03, 1.03, 1.03);
            }
            80% {
                transform: scale3d(0.97, 0.97, 0.97);
            }
            100% {
                opacity: 1;
                transform: scale3d(1, 1, 1);
            }
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 3.5em;
            }
            h2 {
                font-size: 1.5em;
            }
            p {
                font-size: 1em;
            }
            .container {
                padding: 30px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.5em;
            }
            h2 {
                font-size: 1.2em;
            }
            p {
                font-size: 0.9em;
            }
            .container {
                padding: 20px;
            }
            .home-button {
                padding: 10px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <!-- Background Particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    <!-- Main Content -->
    <div class="container">
        <h1>404</h1>
        <h2>Oops! Lost in the AI Matrix?</h2>
        <p>The page you're searching for might have been moved, renamed, or perhaps it never existed in this dimension. Our AI is trying its best to locate it, but sometimes even they need a break!</p>
        <a href="/" class="home-button">Go Back to Raidpo AI HQ</a>
    </div>

    <script>
        // Optional: You can add JavaScript here for more complex interactions,
        // analytics tracking for 404 hits, or dynamic content.
        // For a simple 404 page, it's not strictly necessary.
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Raidpo AI 404 page loaded.');
            // Example: You could log the referrer or the missing URL to your server for debugging.
            // console.log('Missing URL:', window.location.pathname + window.location.search);
            // console.log('Referrer:', document.referrer);
        });
    </script>
</body>
</html>
