<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Story Generator</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            margin-bottom: 1rem;
            resize: none;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .options select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
        }

        button {
            background: #2575fc;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
            margin: 5px;
        }

        button:hover {
            background: #6a11cb;
        }

        .story-output {
            margin-top: 1rem;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
        }

        .loading {
            display: none;
            font-size: 1.2rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Interactive Story Generator</h1>
        <textarea id="story-input" placeholder="Enter a story prompt (e.g., 'A knight on a quest to save a kingdom')"></textarea>
        <div class="options">
            <select id="length-option">
                <option value="very short">Very Short (1-2 paragraphs)</option>
                <option value="short">Short (3-4 paragraphs)</option>
                <option value="medium">Medium (5-6 paragraphs)</option>
                <option value="long">Long (7-8 paragraphs)</option>
                <option value="very long">Very Long (9+ paragraphs)</option>
                <option value="epic">Epic (20+ paragraphs)</option>
            </select>
            <select id="tone-option">
                <option value="funny">Funny</option>
                <option value="serious">Serious</option>
                <option value="dramatic">Dramatic</option>
                <option value="romantic">Romantic</option>
                <option value="mysterious">Mysterious</option>
                <option value="horror">Horror</option>
                <option value="inspirational">Inspirational</option>
                <option value="sad">Sad</option>
                <option value="exciting">Exciting</option>
                <option value="suspenseful">Suspenseful</option>
                <option value="dark">Dark</option>
                <option value="lighthearted">Lighthearted</option>
            </select>
        </div>
        <button id="generate-story">Generate Story</button>
        <div class="loading" id="loading">Generating your story... ✨</div>
        <div class="story-output" id="story-output"></div>
    </div>

    <script>
        const apiKey = 'AIzaSyAF2vtoO7YGSYFtbknlr6l8kPeCBdPRc9o'; // Your Gemini API key
        const generateButton = document.getElementById('generate-story');
        const storyInput = document.getElementById('story-input');
        const lengthOption = document.getElementById('length-option');
        const toneOption = document.getElementById('tone-option');
        const storyOutput = document.getElementById('story-output');
        const loading = document.getElementById('loading');

        // Function to generate content using the gemini-1.5-flash model
        async function generateContent(prompt, length, tone) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Write a ${length} ${tone} story about: ${prompt}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error.message);
                }
                return data.candidates[0].content.parts[0].text;
            } catch (error) {
                throw error;
            }
        }

        // Generate story on button click
        generateButton.addEventListener('click', async () => {
            const prompt = storyInput.value.trim();
            if (!prompt) {
                alert('Please enter a story prompt!');
                return;
            }

            // Show loading message
            loading.style.display = 'block';
            storyOutput.textContent = '';

            try {
                const length = lengthOption.value;
                const tone = toneOption.value;
                const generatedText = await generateContent(prompt, length, tone);
                storyOutput.textContent = generatedText;
            } catch (error) {
                storyOutput.textContent = `Error: ${error.message}`;
                console.error(error);
            } finally {
                // Hide loading message
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
