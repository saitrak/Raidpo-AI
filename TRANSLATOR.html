<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raidpo AI - All Language Translator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background-color: #0f0f0f;
    }

    .hero {
      text-align: center;
      padding: 6rem 2rem;
      background: linear-gradient(135deg, #ff6f61, #ff3b2f);
    }

    .tool-container {
      max-width: 800px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .translator-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem;
      border: 2px dashed #ff6f61;
      transition: all 0.3s;
    }

    .translator-box:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }

    .text-input {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .text-input textarea {
      width: 100%;
      height: 150px;
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid #ff6f61;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      resize: none;
      outline: none;
    }

    .text-input textarea::placeholder {
      color: #ccc;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .controls .row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .controls select {
      padding: 0.5rem 1rem;
      border-radius: 5px;
      border: 1px solid #ff6f61;
      background: #333;
      color: #fff;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    .controls select option {
      background: #333;
      color: #fff;
    }

    .controls .icons {
      display: flex;
      gap: 1rem;
    }

    .controls .icons i {
      font-size: 1.2rem;
      color: #ff6f61;
      cursor: pointer;
      transition: color 0.3s;
    }

    .controls .icons i:hover {
      color: #ff3b2f;
    }

    .translate-btn {
      width: 100%;
      padding: 1rem;
      background: #fff;
      color: #ff3b2f;
      border-radius: 50px;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
    }

    .translate-btn:hover {
      background: #ff6f61;
      color: #fff;
      transform: scale(1.05);
    }

    .translate-btn:disabled {
      background: #ccc;
      color: #666;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>All Language Translator</h1>
    <p>Translate text from any language to any language instantly.</p>
  </section>

  <div class="tool-container">
    <div class="translator-box">
      <div class="text-input">
        <textarea spellcheck="false" class="from-text" placeholder="Enter text"></textarea>
        <textarea spellcheck="false" readonly disabled class="to-text" placeholder="Translation"></textarea>
      </div>
      <ul class="controls">
        <li class="row from">
          <div class="icons">
            <i id="fromVolume" class="fas fa-volume-up"></i>
            <i id="fromCopy" class="fas fa-copy"></i>
          </div>
          <select></select>
        </li>
        <li class="exchange"><i class="fas fa-exchange-alt"></i></li>
        <li class="row to">
          <select></select>
          <div class="icons">
            <i id="toVolume" class="fas fa-volume-up"></i>
            <i id="toCopy" class="fas fa-copy"></i>
          </div>
        </li>
      </ul>
      <button class="translate-btn" id="translateBtn">Translate Text</button>
    </div>
  </div>

  <script>
    const countries = {
      "af-ZA": "Afrikaans",
      "ak-GH": "Akan",
      "sq-AL": "Albanian",
      "am-ET": "Amharic",
      "ar-SA": "Arabic",
      "hy-AM": "Armenian",
      "as-IN": "Assamese",
      "ay-BO": "Aymara",
      "az-AZ": "Azerbaijani",
      "bm-ML": "Bambara",
      "eu-ES": "Basque",
      "be-BY": "Belarusian",
      "bn-IN": "Bengali",
      "bho-IN": "Bhojpuri",
      "bs-BA": "Bosnian",
      "bg-BG": "Bulgarian",
      "my-MM": "Burmese",
      "ca-ES": "Catalan",
      "ceb-PH": "Cebuano",
      "ny-MW": "Chichewa",
      "zh-CN": "Chinese (Simplified)",
      "zh-TW": "Chinese (Traditional)",
      "co-FR": "Corsican",
      "hr-HR": "Croatian",
      "cs-CZ": "Czech",
      "da-DK": "Danish",
      "dv-MV": "Dhivehi",
      "doi-IN": "Dogri",
      "nl-NL": "Dutch",
      "en-GB": "English",
      "eo-EO": "Esperanto",
      "et-EE": "Estonian",
      "ee-TG": "Ewe",
      "fil-PH": "Filipino",
      "fi-FI": "Finnish",
      "fr-FR": "French",
      "fy-NL": "Frisian",
      "gl-ES": "Galician",
      "ka-GE": "Georgian",
      "de-DE": "German",
      "el-GR": "Greek",
      "gn-PY": "Guarani",
      "gu-IN": "Gujarati",
      "ht-HT": "Haitian Creole",
      "ha-NE": "Hausa",
      "haw-US": "Hawaiian",
      "he-IL": "Hebrew",
      "hi-IN": "Hindi",
      "hmn-HMN": "Hmong",
      "hu-HU": "Hungarian",
      "is-IS": "Icelandic",
      "ig-NG": "Igbo",
      "ilo-PH": "Ilocano",
      "id-ID": "Indonesian",
      "ga-IE": "Irish",
      "it-IT": "Italian",
      "ja-JP": "Japanese",
      "jv-ID": "Javanese",
      "kn-IN": "Kannada",
      "kk-KZ": "Kazakh",
      "km-KM": "Khmer",
      "rw-RW": "Kinyarwanda",
      "gom-IN": "Konkani",
      "ko-KR": "Korean",
      "kri-SL": "Krio",
      "ku-TR": "Kurdish",
      "ckb-IQ": "Kurdish (Sorani)",
      "ky-KG": "Kyrgyz",
      "lo-LA": "Lao",
      "la-VA": "Latin",
      "lv-LV": "Latvian",
      "ln-CD": "Lingala",
      "lt-LT": "Lithuanian",
      "lg-UG": "Luganda",
      "lb-LU": "Luxembourgish",
      "mk-MK": "Macedonian",
      "mai-IN": "Maithili",
      "mg-MG": "Malagasy",
      "ms-MY": "Malay",
      "ml-IN": "Malayalam",
      "mt-MT": "Maltese",
      "mi-NZ": "Maori",
      "mr-IN": "Marathi",
      "mni-IN": "Meiteilon (Manipuri)",
      "lus-IN": "Mizo",
      "mn-MN": "Mongolian",
      "nl-NL": "Dutch",
      "ne-NP": "Nepali",
      "no-NO": "Norwegian",
      "or-IN": "Odia",
      "om-ET": "Oromo",
      "ps-PK": "Pashto",
      "fa-IR": "Persian",
      "pl-PL": "Polish",
      "pt-PT": "Portuguese",
      "pa-IN": "Punjabi",
      "qu-PE": "Quechua",
      "ro-RO": "Romanian",
      "ru-RU": "Russian",
      "sm-WS": "Samoan",
      "sa-IN": "Sanskrit",
      "gd-GB": "Scots Gaelic",
      "nso-ZA": "Sepedi",
      "sr-RS": "Serbian",
      "st-LS": "Sesotho",
      "sn-ZW": "Shona",
      "sd-PK": "Sindhi",
      "si-LK": "Sinhala",
      "sk-SK": "Slovak",
      "sl-SI": "Slovenian",
      "so-SO": "Somali",
      "es-ES": "Spanish",
      "su-ID": "Sundanese",
      "sw-TZ": "Swahili",
      "sv-SE": "Swedish",
      "tg-TJ": "Tajik",
      "ta-LK": "Tamil",
      "tt-RU": "Tatar",
      "te-IN": "Telugu",
      "th-TH": "Thai",
      "ti-ER": "Tigrinya",
      "ts-ZA": "Tsonga",
      "tr-TR": "Turkish",
      "tk-TM": "Turkmen",
      "ak-GH": "Twi",
      "uk-UA": "Ukrainian",
      "ur-PK": "Urdu",
      "ug-CN": "Uyghur",
      "uz-UZ": "Uzbek",
      "vi-VN": "Vietnamese",
      "cy-GB": "Welsh",
      "xh-ZA": "Xhosa",
      "yi-YD": "Yiddish",
      "yo-NG": "Yoruba",
      "zu-ZA": "Zulu"
    };

    const fromText = document.querySelector(".from-text"),
      toText = document.querySelector(".to-text"),
      exchageIcon = document.querySelector(".exchange"),
      selectTag = document.querySelectorAll("select"),
      translateBtn = document.getElementById("translateBtn"),
      fromVolume = document.getElementById("fromVolume"),
      toVolume = document.getElementById("toVolume"),
      fromCopy = document.getElementById("fromCopy"),
      toCopy = document.getElementById("toCopy");

    // Populate language dropdowns
    selectTag.forEach((tag, id) => {
      for (let country_code in countries) {
        let selected = id == 0 ? country_code == "en-GB" ? "selected" : "" : country_code == "hi-IN" ? "selected" : "";
        let option = `<option ${selected} value="${country_code}">${countries[country_code]}</option>`;
        tag.insertAdjacentHTML("beforeend", option);
      }
    });

    // Swap text and languages
    exchageIcon.addEventListener("click", () => {
      let tempText = fromText.value,
        tempLang = selectTag[0].value;
      fromText.value = toText.value;
      toText.value = tempText;
      selectTag[0].value = selectTag[1].value;
      selectTag[1].value = tempLang;
    });

    // Clear translation if input is empty
    fromText.addEventListener("keyup", () => {
      if (!fromText.value) {
        toText.value = "";
      }
    });

    // Translate text
    translateBtn.addEventListener("click", () => {
      let text = fromText.value.trim(),
        translateFrom = selectTag[0].value,
        translateTo = selectTag[1].value;
      if (!text) return;

      // Change button text and disable it
      translateBtn.textContent = "Translating...";
      translateBtn.disabled = true;

      toText.setAttribute("placeholder", "Translating...");
      let apiUrl = `https://api.mymemory.translated.net/get?q=${text}&langpair=${translateFrom}|${translateTo}`;
      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          toText.value = data.responseData.translatedText;
          data.matches.forEach(data => {
            if (data.id === 0) {
              toText.value = data.translation;
            }
          });
          toText.setAttribute("placeholder", "Translation");
        })
        .catch(() => {
          toText.value = "Translation failed. Please try again.";
        })
        .finally(() => {
          // Revert button text and enable it
          translateBtn.textContent = "Translate Text";
          translateBtn.disabled = false;
        });
    });

    // Copy text
    fromCopy.addEventListener("click", () => {
      if (fromText.value) {
        navigator.clipboard.writeText(fromText.value);
        alert("Text copied to clipboard!");
      }
    });

    toCopy.addEventListener("click", () => {
      if (toText.value) {
        navigator.clipboard.writeText(toText.value);
        alert("Text copied to clipboard!");
      }
    });

    // Text-to-speech
    fromVolume.addEventListener("click", () => {
      if (fromText.value) {
        let utterance = new SpeechSynthesisUtterance(fromText.value);
        utterance.lang = selectTag[0].value;
        speechSynthesis.speak(utterance);
      }
    });

    toVolume.addEventListener("click", () => {
      if (toText.value) {
        let utterance = new SpeechSynthesisUtterance(toText.value);
        utterance.lang = selectTag[1].value;
        speechSynthesis.speak(utterance);
      }
    });
  </script>
</body>
</html>
