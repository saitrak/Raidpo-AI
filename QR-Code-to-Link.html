<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code to Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background-color: #1a1a1a;
    }

    .hero {
      text-align: center;
      padding: 6rem 2rem;
      background: linear-gradient(135deg, #ff6f61, #ff3b2f);
    }

    .tool-container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .upload-box {
      border: 2px dashed #ff6f61;
      padding: 3rem;
      border-radius: 20px;
      margin: 2rem auto;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .upload-box:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }

    .upload-box i {
      font-size: 2.5rem;
      color: #ff6f61;
    }

    .upload-box p {
      margin: 0;
      font-size: 1rem;
      color: #fff;
      text-align: center;
      white-space: nowrap; /* Prevent text from wrapping */
    }

    .process-btn {
      padding: 1rem 2rem;
      background: #fff;
      color: #ff3b2f;
      border-radius: 50px;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
      margin: 1rem auto;
      display: block;
      transition: all 0.3s;
    }

    .process-btn:hover:not(:disabled) {
      background: #ff6f61;
      color: #fff;
      transform: scale(1.05);
    }

    .process-btn:disabled {
      background: #ccc;
      color: #666;
      cursor: not-allowed;
    }

    .output-box {
      margin-top: 2rem;
      text-align: center;
    }

    .output-box input {
      width: 90%;
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid #ff6f61;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      margin-bottom: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>QR Code to Link</h1>
    <p>Extract links or text from QR codes.</p>
  </section>

  <div class="tool-container">
    <label class="upload-box">
      <i class="fas fa-cloud-upload-alt"></i>
      <p id="uploadText">Drag & drop QR code image or click to upload</p>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </label>

    <button class="process-btn" id="processBtn">Extract Link</button>

    <div class="output-box">
      <input type="text" id="outputText" placeholder="Extracted link or text will appear here..." readonly>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const outputText = document.getElementById('outputText');
    const uploadText = document.getElementById('uploadText');

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        uploadText.textContent = fileInput.files[0].name + ' uploaded!';
      }
    });

    processBtn.addEventListener('click', async () => {
      if (!fileInput.files.length) return alert('Please upload a QR code image first.');

      // Disable the button during processing
      processBtn.disabled = true;
      processBtn.textContent = 'Extracting...';

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = (e) => {
        const image = new Image();
        image.src = e.target.result;

        image.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = image.width;
          canvas.height = image.height;
          ctx.drawImage(image, 0, 0);

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);

          if (code) {
            outputText.value = code.data;
          } else {
            alert('No QR code found in the image.');
          }

          // Re-enable the button after processing
          processBtn.disabled = false;
          processBtn.textContent = 'Extract Link';
        };
      };

      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
