<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raidpo AI</title>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dml8j7b8w/image/upload/v1751829931/lzk7ckkwyrhiqtio8g8i.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    ::selection { background-color: #ff6f61; color: #fff; }
    body { font-family: 'Comic Sans MS', cursive, sans-serif; color: #fff; background-color: #0f0f0f; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    body.android-device, body.android-device a, body.android-device button { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; }
    a { text-decoration: none; color: inherit; }
    .content-container { background-color: #1a1a1a; padding: clamp(2rem, 8vw, 4rem); border-radius: 10px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; border: 1px solid #333; }
    .content-section { display: none; }
    .content-icon { font-size: clamp(4rem, 15vw, 6rem); color: #ff6f61; margin-bottom: 1.5rem; display: inline-block; animation: float 4s ease-in-out infinite; }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }
    .content-container h1 { font-size: clamp(2.5rem, 10vw, 4rem); line-height: 1.2; color: #fff; text-shadow: 0 0 15px rgba(255, 111, 97, 0.4); }
    #not-found-content h1 { font-size: clamp(5rem, 25vw, 10rem); }
    .content-container h2 { font-size: clamp(1.2rem, 5vw, 1.8rem); color: #ccc; margin-top: 0.5rem; margin-bottom: 1.5rem; }
    .content-container p { color: #aaa; font-size: clamp(0.9rem, 3vw, 1.1rem); margin-bottom: 2.5rem; max-width: 450px; margin-left: auto; margin-right: auto; }
    .home-btn { display: inline-block; padding: 1rem 2.5rem; background-color: #ff6f61; color: #fff; border: none; border-radius: 5px; font-size: clamp(0.9rem, 3vw, 1rem); font-weight: bold; cursor: pointer; transition: background-color 0.3s, transform 0.2s ease; }
    .home-btn:hover { background-color: #ff3b2f; transform: translateY(-3px); }
  </style>
</head>
<body>

  <div class="content-container">
    <!-- Section 1: Coming Soon Message (hidden by default) -->
    <div id="coming-soon-content" class="content-section">
      <i class="fas fa-rocket content-icon"></i>
      <h1>Coming Soon!</h1>
      <h2>This Feature is on the Way</h2>
      <p>The page for <strong id="coming-soon-path"></strong> is under construction. We're working hard to launch it soon!</p>
    </div>

    <!-- Section 2: 404 Not Found Message (hidden by default) -->
    <div id="not-found-content" class="content-section">
      <i class="fas fa-ghost content-icon"></i>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page for <strong id="not-found-path"></strong> doesn't exist and isn't a planned feature.</p>
    </div>

    <a href="https://raidpo-ai.netlify.app/" class="home-btn">
      <i class="fas fa-home"></i> Go to Homepage
    </a>
  </div>

  <script>
    if (/android/i.test(navigator.userAgent)) {
      document.body.classList.add('android-device');
    }

    // =========================================================================
    // == THIS IS THE ONLY PLACE YOU EDIT ==
    // =========================================================================
    // Add any path that should show a "Coming Soon" message to this list.
    // The path MUST start with a '/'.
    const comingSoonPaths = [
      '/dashboard',
      '/analytics',
      '/settings',
      '/user-profile',
      '/api-docs',
      '/billing',
      '/integrations'
    ];
    // =========================================================================


    // --- The logic that makes it work ---
    function displayContent() {
      // Get the path from the URL hash (the part after #)
      // e.g., in "error.html#/dashboard", this gets "/dashboard"
      const path = window.location.hash.substring(1);

      const comingSoonSection = document.getElementById('coming-soon-content');
      const notFoundSection = document.getElementById('not-found-content');

      // If the path from the URL is in our list...
      if (path && comingSoonPaths.includes(path)) {
        // Show the "Coming Soon" message
        document.title = 'Coming Soon | Raidpo AI';
        document.getElementById('coming-soon-path').textContent = path;
        comingSoonSection.style.display = 'block';
      } else {
        // Otherwise, show the "404 Not Found" message
        document.title = '404 Not Found | Raidpo AI';
        document.getElementById('not-found-path').textContent = path || "the requested page";
        notFoundSection.style.display = 'block';
      }
    }

    // Run the function when the page loads
    displayContent();

    // Also run the function if the hash changes (for single-page app behavior)
    window.addEventListener('hashchange', displayContent);
  </script>

</body>
</html>
