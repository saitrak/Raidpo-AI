<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raidpo AI - Image Enhancer</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background-color: #0f0f0f;
    }

    .hero {
      text-align: center;
      padding: 6rem 2rem;
      background: linear-gradient(135deg, #ff6f61, #ff3b2f);
    }

    .tool-container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .upload-box {
      border: 2px dashed #ff6f61;
      padding: 3rem;
      border-radius: 20px;
      margin: 2rem auto;
      max-width: 600px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .upload-box:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }

    .upload-box i {
      font-size: 2.5rem;
      color: #ff6f61;
    }

    .image-preview {
      margin-top: 2rem;
      display: flex;
      justify-content: space-around;
      gap: 2rem;
    }

    .image-preview .box {
      width: 45%;
      height: 400px;
      border: 2px solid #ff6f61;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
    }

    .image-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .process-btn {
      padding: 1rem 2rem;
      background: #fff;
      color: #ff3b2f;
      border-radius: 50px;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
      margin: 1rem auto;
      display: block;
      transition: all 0.3s;
    }

    .process-btn:hover {
      background: #ff6f61;
      color: #fff;
      transform: scale(1.05);
    }

    .download-btn {
      padding: 1rem 2rem;
      background: #28a745;
      color: #fff;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      margin: 1rem auto;
      display: none;
      transition: transform 0.3s;
    }

    .download-btn:hover {
      transform: translateY(-3px);
    }

    .error-message {
      color: red;
      text-align: center;
      margin-top: 1rem;
    }

    .quality-info {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #ccc;
      text-align: center;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Image Enhancer</h1>
    <p>Enhance image quality with AI-powered tools.</p>
  </section>

  <div class="tool-container">
    <!-- Upload Section -->
    <label class="upload-box">
      <i class="fas fa-cloud-upload-alt"></i>
      <p id="uploadText">Drag & drop image or click to upload</p>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </label>

    <!-- Process Button -->
    <button class="process-btn" id="enhanceBtn">Enhance Image</button>

    <!-- Error Message -->
    <div class="error-message" id="errorMessage"></div>

    <!-- Image Preview -->
    <div class="image-preview">
      <div id="originalImageBox" class="box placeholder">
        <i class="fas fa-image"></i>
        <p>Original Image</p>
      </div>
      <div id="enhancedImageBox" class="box placeholder">
        <i class="fas fa-magic"></i>
        <p>Enhanced Image</p>
      </div>
    </div>

    <!-- Quality Info -->
    <div class="quality-info">
      <p><strong>Original Image:</strong> Quality varies based on input.</p>
      <p><strong>Enhanced Image:</strong> Upscaled using AI for improved clarity.</p>
    </div>

    <!-- Download Button -->
    <button class="download-btn" id="downloadBtn">Download Enhanced Image</button>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const enhanceBtn = document.getElementById('enhanceBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const errorMessage = document.getElementById('errorMessage');
    const uploadText = document.getElementById('uploadText');
    const originalImageBox = document.getElementById('originalImageBox');
    const enhancedImageBox = document.getElementById('enhancedImageBox');

    let originalImageUrl = null;
    let enhancedImageUrl = null;

    // Handle file selection
    fileInput.addEventListener('change', handleFileSelect);

    function handleFileSelect() {
      if (!fileInput.files.length) return;

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = (e) => {
        originalImageUrl = e.target.result;
        originalImageBox.innerHTML = `<img src="${originalImageUrl}" alt="Original Image">`;
        uploadText.textContent = `${file.name} uploaded successfully!`;
      };

      reader.readAsDataURL(file);
      errorMessage.textContent = '';
      enhancedImageBox.innerHTML = `<i class="fas fa-magic"></i><p>Enhanced Image</p>`;
      downloadBtn.style.display = 'none';
    }

    // Handle enhancement process
    enhanceBtn.addEventListener('click', async () => {
      if (!originalImageUrl) {
        errorMessage.textContent = 'Please upload an image first.';
        return;
      }

      errorMessage.textContent = '';
      enhancedImageBox.innerHTML = `<i class="fas fa-spinner fa-spin"></i><p>Enhancing...</p>`;
      downloadBtn.style.display = 'none';

      try {
        const response = await fetch('https://api.picsart.io/tools/1.0/upscale/ultra', {
          method: 'POST',
          headers: {
            accept: 'application/json',
            'X-Picsart-API-Key': 'eyJraWQiOiI5NzIxYmUzNi1iMjcwLTQ5ZDUtOTc1Ni05ZDU5N2M4NmIwNTEiLCJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJhdXRoLXNlcnZpY2UtN2U5YTI0MWMtN2VkMS00YjRlLTlkZWQtYmVjZGEzZDQ1ZTQ0IiwiYXVkIjoiNDcyNTYwMDk1MDA3MTAxIiwibmJmIjoxNzQwNjc1Mjc5LCJzY29wZSI6WyJiMmItYXBpLmdlbl9haSIsImIyYi1hcGkuaW1hZ2VfYXBpIl0sImlzcyI6Imh0dHBzOi8vYXBpLnBpY3NhcnQuY29tL3Rva2VuLXNlcnZpY2UiLCJvd25lcklkIjoiNDcyNTYwMDk1MDA3MTAxIiwiaWF0IjoxNzQwNjc1Mjc5LCJqdGkiOiJlMmY4NWMzMy03OWFmLTQwODItYmZiYi0yNzI2YWZkZDMwMzMifQ.Kk3lva0RR71oZwDFnLbfd--Aw1FzroePci4s_ffmKBzYliW3T7j-L9C-7S4j79umAtQ6dZwp27jJRZTXKi-NLVYV6PsGe88WTAv267HxDJom7lvGbu_mN5UcJ3xt0R2pk_mkNrmLjP-aI_opUqA1n7NYLFb7k79CYtiCN1AjI6JRICj05Rh2-ASeto6BREWAVbSNEa-B37B2Xk_y3WJqQu1-ot1TDOu9O7772bFWf9ZKTjhtx0AYDL5PC1asdJshrQhalL-9huOyc3-ojBcvOlCI0Qbkva2-bho6DD6OnNuE8f3wYJYRrolfFrXNGgak8FfIs2wxjpG1cPcePiBuJA'
          },
          body: createFormData(originalImageUrl)
        });

        if (!response.ok) {
          throw new Error(`Error: ${response.status} - ${response.statusText}`);
        }

        const data = await response.json();

        if (data.data && data.data.url) {
          enhancedImageUrl = data.data.url;
          enhancedImageBox.innerHTML = `<img src="${enhancedImageUrl}" alt="Enhanced Image">`;
          downloadBtn.style.display = 'block';
          downloadBtn.onclick = () => downloadEnhancedImage(enhancedImageUrl);
        } else {
          throw new Error('Failed to enhance the image.');
        }
      } catch (error) {
        errorMessage.textContent = error.message;
        enhancedImageBox.innerHTML = `<i class="fas fa-exclamation-triangle"></i><p>Enhancement Failed</p>`;
      }
    });

    // Helper functions
    function createFormData(imageSrc) {
      const form = new FormData();
      const byteString = atob(imageSrc.split(',')[1]);
      const arrayBuffer = new ArrayBuffer(byteString.length);
      const uint8Array = new Uint8Array(arrayBuffer);

      for (let i = 0; i < byteString.length; i++) {
        uint8Array[i] = byteString.charCodeAt(i);
      }

      const blob = new Blob([uint8Array], { type: 'image/jpeg' });
      form.append('image', blob, 'image.jpg');
      form.append('upscale_factor', '4'); // Increased upscale factor for better visibility
      form.append('format', 'JPG');
      form.append('mode', 'sync');

      return form;
    }

    async function downloadEnhancedImage(url) {
      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error('Failed to fetch the enhanced image.');
        }

        const blob = await response.blob();
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'enhanced-image.jpg';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (error) {
        errorMessage.textContent = `Download failed: ${error.message}`;
      }
    }
  </script>
</body>
</html>
