<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Nexus</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background-color: #0f0f0f;
    }

    .hero {
      text-align: center;
      padding: 6rem 2rem;
      background: linear-gradient(135deg, #ff6f61, #ff3b2f);
    }

    .tool-container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .prompt-box {
      border: 2px dashed #ff6f61;
      padding: 3rem;
      border-radius: 20px;
      margin: 2rem auto;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
      text-align: center;
    }

    .prompt-box:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }

    #question {
      width: 100%;
      height: 150px;
      padding: 1rem;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      resize: vertical;
    }

    .options-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    .option-group {
      background: rgba(255, 255, 255, 0.05);
      padding: 1.5rem;
      border-radius: 15px;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .preset-card {
      padding: 1rem;
      border: 1px solid #ff6f61;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .preset-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #ff6f61, #ff3b2f);
      opacity: 0;
      transition: opacity 0.3s;
      z-index: -1;
    }

    .preset-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(255, 111, 97, 0.3);
    }

    .preset-card.selected {
      border: 2px solid #ff6f61;
      background: rgba(255, 111, 97, 0.1);
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(255, 111, 97, 0.3);
    }

    .preset-card i {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #ff6f61;
    }

    .process-btn {
      padding: 1rem 2rem;
      background: #fff;
      color: #ff3b2f;
      border-radius: 50px;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
      margin: 2rem auto;
      display: block;
      transition: all 0.3s;
    }

    .process-btn:hover {
      background: #ff6f61;
      color: #fff;
      transform: scale(1.05);
    }

    .answer {
      margin-top: 2rem;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      color: #fff;
    }

    .answer img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin-top: 10px;
    }

    .source-link {
      margin-top: 10px;
      font-size: 14px;
      color: #ff6f61;
    }

    .section {
      margin-top: 20px;
    }

    .section h3 {
      margin-bottom: 10px;
    }

    iframe {
      width: 100%;
      height: 315px;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
    }

    .important {
      background-color: #ffffcc;
      padding: 5px;
      border-radius: 4px;
    }

    .loader {
      display: none;
      border: 4px solid #333;
      border-top: 4px solid #ff6f61;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-message {
      color: #ff4444;
      padding: 1rem;
      display: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Knowledge Nexus</h1>
    <p>Your ultimate tool for exploring knowledge, images, and more.</p>
  </section>

  <div class="tool-container">
    <div class="prompt-box">
      <textarea 
        id="question" 
        placeholder="Ask anything... (e.g. 'Tell me about the Titanic')"
      ></textarea>
    </div>

    <button class="process-btn" onclick="getAnswer()">Get Answer</button>

    <div class="answer" id="answer"></div>

    <!-- Section for Real Video Footage (hidden by default) -->
    <div class="section" id="real-video-footage" style="display: none;">
      <h3>Real Video Footage</h3>
      <div id="video-results"></div>
    </div>
  </div>

  <script>
    // Your Google API Key and Search Engine ID
    const GOOGLE_API_KEY = 'AIzaSyBMKXLxMoImnFsOHA_uoV8Ag7FiRaxgQ2g';
    const GOOGLE_SEARCH_ENGINE_ID = '72ff32fd467d44e36';

    // YouTube API Key
    const YOUTUBE_API_KEY = 'AIzaSyCwv56pmMt89Y6Ba3H7fCuL0OqV_o9BGz4'; // Your YouTube API key

    // Unsplash API Key
    const UNSPLASH_ACCESS_KEY = 'rd8onNE_RuItqXPk2ZzzptATrxHErn8MnOSScPEJjwk'; // Your Unsplash API key

    // NewsAPI Keys (rotating system)
    const NEWS_API_KEYS = [
      '249a919378314d399f57dac3f8fa1ab6', // Your existing NewsAPI key
      'b88875aafe32434dbc6b37879960897a', // Your second NewsAPI key
      '8fe312a50887452eaf55a950a698d763'  // Your third NewsAPI key
    ];
    let newsApiCounter = 0;

    // Function to get the next NewsAPI key
    function getNewsApiKey() {
      const key = NEWS_API_KEYS[newsApiCounter];
      newsApiCounter = (newsApiCounter + 1) % NEWS_API_KEYS.length;
      return key;
    }

    // Function to fetch real video footage from YouTube (max 3 videos)
    async function fetchRealVideoFootage(query) {
      const videoResults = document.getElementById('video-results');
      videoResults.innerHTML = '<p>Loading real video footage...</p>';

      try {
        const response = await fetch(
          `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query + " real footage")}&key=${YOUTUBE_API_KEY}&maxResults=3`
        );
        const data = await response.json();

        if (data.items && data.items.length > 0) {
          videoResults.innerHTML = ''; // Clear loading message
          data.items.forEach(item => {
            videoResults.innerHTML += `
              <div class="video-item">
                <iframe src="https://www.youtube.com/embed/${item.id.videoId}" allowfullscreen></iframe>
                <p><strong>${item.snippet.title}</strong></p>
                <a class="source-link" href="https://www.youtube.com/watch?v=${item.id.videoId}" target="_blank">Watch on YouTube</a>
              </div>
            `;
          });
        } else {
          videoResults.innerHTML = '<p>No real video footage found.</p>';
        }
      } catch (error) {
        videoResults.innerHTML = '<p>Failed to load real video footage.</p>';
        console.error(error);
      }
    }

    async function getAnswer() {
      const question = document.getElementById('question').value;
      const answerElement = document.getElementById('answer');
      const realVideoSection = document.getElementById('real-video-footage');

      if (!question) {
        answerElement.textContent = 'Please enter a question.';
        realVideoSection.style.display = 'none'; // Hide real video footage section
        return;
      }

      answerElement.textContent = 'Fetching answer...';
      realVideoSection.style.display = 'block'; // Show real video footage section

      try {
        let answer = '';

        // Step 1: Fetch Wikipedia data
        const wikiResponse = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(question)}`);
        if (wikiResponse.ok) {
          const wikiData = await wikiResponse.json();

          // Display Wikipedia content
          answer += `<div class="section">
            <h2>${wikiData.title}</h2>
            ${wikiData.thumbnail ? `<img src="${wikiData.thumbnail.source}" alt="${wikiData.title}">` : ''}
            <p>${wikiData.extract}</p>
            <p><a class="source-link" href="${wikiData.content_urls.desktop.page}" target="_blank">Read more on Wikipedia</a></p>
          </div>`;
        }

        // Step 2: Fetch Google Custom Search results
        const googleResponse = await fetch(`https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(question)}&key=${GOOGLE_API_KEY}&cx=${GOOGLE_SEARCH_ENGINE_ID}`);
        const googleData = await googleResponse.json();

        if (googleData.items && googleData.items.length > 0) {
          answer += `<div class="section">
            <h3>Additional Information from Google</h3>`;
          googleData.items.slice(0, 3).forEach(item => {
            answer += `<p><strong>${item.title}</strong><br>${item.snippet}<br><a class="source-link" href="${item.link}" target="_blank">Source</a></p>`;
          });
          answer += `</div>`;
        }

        // Step 3: Fetch YouTube videos (important videos only)
        const youtubeResponse = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(question + " important")}&key=${YOUTUBE_API_KEY}&maxResults=5`);
        const youtubeData = await youtubeResponse.json();

        if (youtubeData.items && youtubeData.items.length > 0) {
          answer += `<div class="section">
            <h3>Important YouTube Videos</h3>`;
          youtubeData.items.forEach(item => {
            answer += `<p><strong>${item.snippet.title}</strong><br>
              <iframe src="https://www.youtube.com/embed/${item.id.videoId}" allowfullscreen></iframe>
              <a class="source-link" href="https://www.youtube.com/watch?v=${item.id.videoId}" target="_blank">Watch on YouTube</a></p>`;
          });
          answer += `</div>`;
        }

        // Step 4: Fetch Images (using Unsplash API)
        const unsplashResponse = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(question)}&client_id=${UNSPLASH_ACCESS_KEY}`);
        const unsplashData = await unsplashResponse.json();

        if (unsplashData.results && unsplashData.results.length > 0) {
          answer += `<div class="section">
            <h3>Images</h3>`;
          unsplashData.results.slice(0, 3).forEach(image => {
            answer += `<img src="${image.urls.regular}" alt="${image.description}">`;
          });
          answer += `</div>`;
        }

        // Step 5: Fetch News Articles (using NewsAPI with rotating keys)
        const newsApiKey = getNewsApiKey();
        const newsResponse = await fetch(`https://newsapi.org/v2/everything?q=${encodeURIComponent(question)}&apiKey=${newsApiKey}`);
        const newsData = await newsResponse.json();

        if (newsData.articles && newsData.articles.length > 0) {
          answer += `<div class="section">
            <h3>Latest News (5+ Articles)</h3>`;
          newsData.articles.slice(0, 5).forEach(article => {
            answer += `<p><strong>${article.title}</strong><br>${article.description}<br><a class="source-link" href="${article.url}" target="_blank">Read more</a></p>`;
          });
          answer += `</div>`;
        }

        // If no answer is found
        if (answer === '') {
          answerElement.textContent = 'No answer found.';
        } else {
          answerElement.innerHTML = answer;
        }

        // Fetch and display real video footage (max 3 videos)
        fetchRealVideoFootage(question);
      } catch (error) {
        answerElement.textContent = 'An error occurred while fetching the answer.';
        console.error(error);
      }
    }
  </script>
</body>
</html>
