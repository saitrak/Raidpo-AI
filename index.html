<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raidpo AI - Ultimate AI Tools for Every Need | Free Online AI Tools</title>
  <!-- Meta tags and other head content remain the same -->
  <style>
    /* Loading Screen */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0f0f0f;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    
    .loading-animation {
      width: 50px; /* Exact size: 50x50 pixels */
      height: 50px; /* Exact size: 50x50 pixels */
      border: 5px solid #ff6f61;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Rest of your CSS remains the same */
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-animation"></div>
  </div>

  <!-- Rest of your HTML remains the same -->

  <script>
    // Firebase Configuration remains the same

    // DOM Elements remain the same

    // Enhanced Smarter Loading Duration Function
    function handleSmartLoading(user) {
      // Update user profile immediately
      updateUserProfile(user);
      
      // Start a timer for maximum loading time (3 seconds)
      const maxLoadTime = setTimeout(() => {
        finishLoading();
      }, 3000);
      
      // Check if we need to wait for profile image
      if (user && user.photoURL) {
        const img = new Image();
        img.src = user.photoURL;
        
        img.onload = () => {
          clearTimeout(maxLoadTime);
          finishLoading();
        };
        
        img.onerror = () => {
          clearTimeout(maxLoadTime);
          finishLoading();
        };
      } else {
        // No profile image - finish after minimal delay (500ms)
        setTimeout(() => {
          clearTimeout(maxLoadTime);
          finishLoading();
        }, 500);
      }
      
      function finishLoading() {
        loadingScreen.style.display = 'none';
        homepage.style.display = 'block';
      }
    }

    // Profile Menu Handling
    let profileMenuTimeout;
    let isProfileMenuClicked = false;
    
    userAvatar.addEventListener('mouseenter', () => {
      if (!isProfileMenuClicked) {
        clearTimeout(profileMenuTimeout);
        userProfileInfo.classList.add('active');
      }
    });

    userProfile.addEventListener('mouseleave', () => {
      if (!isProfileMenuClicked) {
        profileMenuTimeout = setTimeout(() => {
          userProfileInfo.classList.remove('active');
        }, 1500);
      }
    });

    // Toggle profile menu on click
    userAvatar.addEventListener('click', (e) => {
      e.stopPropagation();
      isProfileMenuClicked = true;
      userProfileInfo.classList.add('active');
    });

    // Click anywhere to close profile menu
    document.addEventListener('click', (e) => {
      if (!userProfile.contains(e.target)) {
        userProfileInfo.classList.remove('active');
        isProfileMenuClicked = false;
      }
    });

    // Check Auth State with smarter loading
    auth.onAuthStateChanged(user => {
      handleSmartLoading(user);
    });

    // Rest of your JavaScript remains the same
  </script>
</body>
</html>
